
# Configuration file for MimicOS using the baseline allocator with 32GB of
# kernel memory.  The baseline allocator is a plain buddy allocator with no
# reservation, promotion or per-CPU pool: every fault takes the same path
# through the buddy, so the kernel reports no fast/slow classification for
# it.  The total memory size is 128GB with a maximum order of 12.

[allocator]
memory_allocator=baseline
max_order = 12

[pmem_alloc]
memory_size = 131072
target_fragmentation = 1.0
target_memory = 0.0
fragmentation_file = ""
kernel_size = 32768
max_order = 12
frag_type = largepage
threshold_for_promotion= 1.1

