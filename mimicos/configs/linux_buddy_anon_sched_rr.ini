
# kanellok@VTW25: Configuration file for MimicOS using the linux_buddy_anon allocator with 32GB memory
# Models Linux anonymous-page allocation: a buddy allocator behind per-CPU
# page lists, so a fault either hits the per-CPU pool or refills it in a batch
# The total memory size is set to 128GB, with a maximum order of 12 (4MB pages)
# The fragmentation type is set to largepage, and the threshold for promotion is set to 0.0 to allow immediate promotion of pages

[allocator]
memory_allocator=linux_buddy_anon
max_order = 12

[pmem_alloc]
memory_size = 131072
target_fragmentation = 1.0
target_memory = 0.0
fragmentation_file = ""
kernel_size = 32768
max_order = 12
frag_type = largepage
threshold_for_promotion= 1.1


# MimicOS's own scheduler, which is separate from Sniper's.  Sniper's
# scheduler/type decides which core a thread runs on; this decides which
# application thread a core runs.  They share no configuration: this is read
# from the section below, and the kernel reads nothing from the simulator's
# config at all.  With no [scheduler] section the policy is DISABLED and the
# kernel falls back to a per-core FIFO runqueue.
[scheduler]
policy = rr
num_cores = 1
timeslice_ns = 4000000
yield_after_fault = true
