
# kanellok@VTW25: Two applications, one kernel thread per core
# Models Linux anonymous-page allocation: a buddy allocator behind per-CPU
# page lists, so a fault either hits the per-CPU pool or refills it in a batch
# The total memory size is set to 128GB, with a maximum order of 12 (4MB pages)
# The fragmentation type is set to largepage, and the threshold for promotion is set to 0.0 to allow immediate promotion of pages

[allocator]
memory_allocator=linux_buddy_anon
max_order = 12

[pmem_alloc]
memory_size = 131072
target_fragmentation = 1.0
target_memory = 0.0
fragmentation_file = ""
kernel_size = 32768
max_order = 12
frag_type = largepage
threshold_for_promotion= 1.1


# Two applications, which gives two kernel cores: the kernel derives its core
# count from this list and pthread_creates a worker for every core past the
# first, each polling its own event queue.  The simulator spawns nothing --
# these are ordinary guest threads that reach it through magic instructions.
[apps]
num_apps = 2
app0 = test/sniper-in-sniper/fft.sift
app1 = test/sniper-in-sniper/fft.sift

[scheduler]
policy = rr
timeslice_ns = 4000000
yield_after_fault = true
