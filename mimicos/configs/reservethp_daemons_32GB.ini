# reservethp_32GB.ini with the three Linux daemon models switched on.
#
# Each daemon is a kernel pthread, so it reaches Sniper as a guest thread
# and needs a core of its own under the static scheduler: run this with
# -n >= 4 (the kernel worker plus kswapd, kcompactd and khugepaged).  With
# fewer cores the run aborts at the daemon's pthread_create with
# "No cores available for spawnThread request".
#
# kcompactd and khugepaged bind to the ReserveTHP allocator's 2MB map and
# buddy (they are only started under reserve_thp); kswapd has nothing to
# bind to here and scans without reclaiming.  Between scans a daemon sleeps
# in simulated time -- usleep() is emulated, the thread is parked and woken
# when the simulated clock reaches its wake-up time -- so the interval is
# a simulated one and the scan counts reported at exit scale with the
# application's simulated run time.
#
# The intervals are deliberately short: the default is 10ms, and the smoke
# trace (test/sniper-in-sniper/fft.sift) finishes in well under one, at
# which point the daemons would be started, reported at exit, and never
# have scanned.

[allocator]
memory_allocator=reserve_thp
max_order = 12

[pmem_alloc]
memory_size = 131072
target_fragmentation = 1.0
target_memory = 0.0
fragmentation_file = ""
kernel_size = 32768
max_order = 12
frag_type = largepage
threshold_for_promotion= 1.1

[daemons]
kcompactd_enabled = true
kcompactd_scan_interval_us = 50
kcompactd_max_pages_per_scan = 64

khugepaged_enabled = true
khugepaged_scan_interval_us = 50
khugepaged_max_promotions_per_scan = 8

kswapd_enabled = true
kswapd_scan_interval_us = 50
kswapd_batch_size = 32
