
# kanellok@VTW25: Two applications, one kernel thread per core
# Models Linux anonymous-page allocation: a buddy allocator behind per-CPU
# page lists, so a fault either hits the per-CPU pool or refills it in a batch
# The total memory size is set to 128GB, with a maximum order of 12 (4MB pages)
# The fragmentation type is set to largepage, and the threshold for promotion is set to 0.0 to allow immediate promotion of pages

[allocator]
memory_allocator=linux_buddy_anon
max_order = 12

[pmem_alloc]
memory_size = 131072
target_fragmentation = 1.0
target_memory = 0.0
fragmentation_file = ""
kernel_size = 32768
max_order = 12
frag_type = largepage
threshold_for_promotion= 1.1


# One application, so one kernel core, so no kernel pthread: core 0 runs on
# the main thread and nothing is spawned.  This is the case that works, and
# the baseline to bisect against -- two applications spawn a worker for the
# second core and the run stops completing.
#
# Note that timeslice_ns below is inert.  Nothing calls the scheduler's
# tick(), so timeslice_remaining_ns never decays and CFS vruntime never
# advances; there are no timer interrupts anywhere in the kernel.  The only
# thing that preempts is the instruction-count quantum the TraceThread
# counts, which posts quantum_expired.
[apps]
num_apps = 1
app0 = test/sniper-in-sniper/fft.sift

[scheduler]
policy = rr
timeslice_ns = 4000000
yield_after_fault = true
