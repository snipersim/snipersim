name: mrowgather.ew
long_name: "Elementwise row gather (take)"
description: |
  Elementwise row gather: for each element in each column, uses the corresponding index from `ms2` to select a row from the same column of `ms1`, and stores the result into `md`
  + `md`, `ms1`, and `ms2` each contain exactly one logical square
  Packed datatypes are unsupported
  `Md[ms1]` and `Md[md]` shall be identical, and `Md[ms2]` shall be an integer datatype
  A tuple that violates any of these requirements is handled according to <<norm:ame_op_supported_contract,the unsupported-datatype-tuple contract>>
  + The low 32 raw bits of each `ms2` index element form an unsigned U32 value; higher element bits are ignored, and an element narrower than 32 bits is zero-extended
  The effective row index is the low `log2(sqrt(AME_NELEM))` bits of that U32 value
  Higher U32 bits are ignored, so an index element never raises an exception regardless of its value.
  Family: elementwise/reduction.
