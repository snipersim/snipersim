name: mmov.a.m
long_name: "Elementwise unconditional move from M register to accumulator"
description: |
  Copies the source square from the M register operand `ms` to the accumulator `acc`
  + The element datatype of `ms` (from `Md[ms]`) and `acc` (from `Ad[acc]`) must match; if they differ, `amestatus.UN` is set and `acc` is left unchanged
  + Let `N = sqrt(AME_NELEM)`
  For non-packed datatypes (`pack_factor = 1`), `ms` holds one `N x N` square; a wide datatype occupies a group of consecutive M registers
  All `AME_NELEM` elements are copied to the single accumulator `acc`
  + For packed datatypes (`pack_factor = AME_UNIT_DATATYPE_SIZE / sizeof(Md[ms]) > 1`), the single register `ms` holds `pack_factor` `N x N` squares
  Each square is copied to a consecutive accumulator starting at `acc`, so the instruction writes the `pack_factor` accumulators `acc`, `acc+1`, ..., `acc + pack_factor - 1`
  If `pack_factor` exceeds <<ame:doc:param:AME_NUM_ACC_REGS,AME_NUM_ACC_REGS>>, `amestatus.UN` is set and no accumulator is written
  Otherwise, every derived index in that complete accumulator span is checked before any source data is read or accumulator is written; an index greater than or equal to `AME_NUM_ACC_REGS` raises an `Illegal Instruction` exception, and a failing check cannot cause a partial transfer
  + The operand datatypes are taken only from the base registers `Md[ms]` and `Ad[acc]`
  As with any register group, the `Md` and `Ad` values of the remaining registers in either group are ignored, and this instruction does not modify any `Md` or `Ad` register.
  Family: move.
