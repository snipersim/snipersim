name: mrowscatmax.ew
long_name: "Elementwise row scatter-max"
description: |
  Elementwise row scatter-max: routes each element of `ms1` to a destination row in `md` determined by the corresponding index in `ms2`, and accumulates with maximum
  + `md` is both a source and destination: elements at the target rows are read, the maximum with the incoming value is taken, and the result is written back
  + `md`, `ms1`, and `ms2` each contain exactly one logical square
  Packed datatypes are unsupported and are handled according to <<norm:ame_op_supported_contract,the unsupported-datatype-tuple contract>>
  + `Md[ms2]` shall be an integer datatype; otherwise the operation is an unsupported datatype tuple
  + The low 32 raw bits of each `ms2` index element form an unsigned U32 value; higher element bits are ignored, and an element narrower than 32 bits is zero-extended
  The effective row index is the low `log2(sqrt(AME_NELEM))` bits of that U32 value
  Higher U32 bits are ignored, so an index element never raises an exception regardless of its value
  + Source elements are processed in ascending logical row-major order
  The first contribution to a destination coordinate reads that coordinate's pre-instruction `md` value; a later contribution to the same coordinate reads the result staged by the preceding contribution
  `ms1` and `ms2` retain their pre-instruction source values throughout
  + For standard floating-point operands, a NaN input to an update produces the destination datatype's canonical quiet NaN
  Otherwise the current destination and incoming source are compared after interpreting each in its own datatype; a `-0`/`+0` tie selects `+0`.
  Family: elementwise/reduction.
