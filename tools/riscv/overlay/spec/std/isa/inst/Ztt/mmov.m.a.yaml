long_name: "Elementwise unconditional move from accumulator to M register"
description: |
  Copies the source square from the accumulator operand to the M register `md`
  + The element datatype of `acc` (from `Ad[acc]`) and `md` (from `Md[md]`) must match; if they differ, `amestatus.UN` is set and `md` is left unchanged
  + Let `N = sqrt(AME_NELEM)`
  For non-packed datatypes (`pack_factor = 1`), the single accumulator `acc` holds one `N x N` square
  All `AME_NELEM` elements are copied to the M register group `md`; a wide datatype occupies a group of consecutive M registers
  + For packed datatypes (`pack_factor = AME_UNIT_DATATYPE_SIZE / sizeof(Md[md]) > 1`), the `pack_factor` consecutive accumulators starting at `acc` each hold one `N x N` square, and all `pack_factor` squares are packed into the single M register `md`
  If `pack_factor` exceeds <<ame:doc:param:AME_NUM_ACC_REGS,AME_NUM_ACC_REGS>>, `amestatus.UN` is set and `md` is left unchanged
  Otherwise, every derived accumulator index in `acc .
  acc + pack_factor - 1` is checked before any accumulator data is read or `md` is written; an index greater than or equal to `AME_NUM_ACC_REGS` raises an `Illegal Instruction` exception, and a failing check cannot cause a partial transfer
  + The destination `md` must satisfy the alignment constraint for its datatype: `md` must be a multiple of the number of M registers consumed by one element
  + The operand datatypes are taken only from the base registers `Ad[acc]` and `Md[md]`
  As with any register group, the `Md` and `Ad` values of the remaining registers in either group are ignored, and this instruction does not modify any `Md` or `Ad` register.
