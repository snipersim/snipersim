description: |
  Reduces each row of `ms1` by maximum and broadcasts the result to all columns of the corresponding row in `md`
  + Let `A_D[i,j]` denote `ms1[i,j]` converted to `Md[md]`
  + The accepted exact tuple shall define the source-to-destination conversion and the maximum operation over two `Md[md]` values; otherwise the tuple is unsupported under <<norm:ame_op_supported_contract,the unsupported-datatype-tuple contract>>
  Each source conversion applies the destination conversion's rounding, saturation, and accrued status-flag behavior before the converted value is compared
  The first converted element seeds the fold
  The remaining converted elements are consumed in ascending column-index order, and every comparison and selection is performed entirely in the destination domain
  For each fold with a standard floating-point destination, if any converted value in that fold is NaN, the result is the destination datatype's canonical quiet NaN
  If none is NaN, the maximum selects one converted value exactly; a `-0`/`+0` tie selects `+0`.
