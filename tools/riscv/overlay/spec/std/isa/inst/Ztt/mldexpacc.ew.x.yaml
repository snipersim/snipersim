long_name: "Elementwise scalar left-shift scale accumulate"
description: |
  Scales every element of square `ms2` by a power of two using the integer exponent from integer register `rs1`, then accumulates the scaled result into `md`
  + `md` is both a source and destination: the existing element is read, the scaled value is added, and the sum is written back
  + The type of the matrix elements is determined by `Md[ms2]`
  `X[rs1]` is zero-extended or low-bit truncated to the width of <<ame:doc:param:AME_MAX_INT_DTYPE,AME_MAX_INT_DTYPE>> and then interpreted using that integer datatype
  The exponent is a fixed-type control scalar and does not read `CSR[amestype]`
  + The complete expression is evaluated without an intermediate conversion to `Md[md]` and is converted to `Md[md]` once.
  Family: elementwise/reduction.  The destination is also a source (accumulating).
