name: mcmpge.ew.x
long_name: "Elementwise scalar compare greater-or-equal"
description: |
  Compares a scalar constant from integer register `rs1` against every element of square `ms2`, storing -1 (all bits set) where the scalar is greater than or equal to the element, and 0 otherwise, into `md`
  + For standard datatypes, the compared values are integer or floating-point and the destination is integer
  The comparison is ordered: a NaN operand makes it false, and `-0` compares equal to `+0`
  A true result is represented by all one bits and a false result by all zero bits in the destination element
  An accepted custom tuple shall define its ordering and these result bit patterns.
