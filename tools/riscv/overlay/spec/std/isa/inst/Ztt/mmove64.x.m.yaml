name: mmove64.x.m
long_name: "Move one 64-bit element from an M register position to an X register (debug)"
description: |
  Reads one 64-bit element from the single M register `ms2` and writes it, zero-extended, to `X[rd]`
  The contents of `ms2` are viewed, in row-major order, as `N = sqrt(AME_NELEM)` rows of `row_elements = (N * AME_UNIT_DATATYPE_SIZE) / 64` 64-bit elements each, independent of the configured datatype `Md[ms2]`
  + This 64-bit form requires `XLEN >= 64`; when `XLEN < 64`, the instruction raises an `Illegal Instruction` exception
  + The element position `pos` is selected by the low `log2(N * row_elements)` bits of `X[rs1]`, exactly as in `<<ame:doc:inst:mmove64_m_x,mmove64.m.x>>`; higher bits are ignored
  The selected column is `pos % row_elements` and the selected row is `pos / row_elements`
  + The element size is defined by the instruction itself: it does not read `CSR[amestype]`, does not read or convert using `Md[ms2]`, does not form a register group, and never sets `amestatus.UN`
  The register contents are first normalized with the row-major layout transformation, using the unsigned integer datatype of size `AME_UNIT_DATATYPE_SIZE`, for which exactly one square occupies one M register; the normalized image is then reinterpreted, by bit slicing, as `N` rows of `row_elements` elements of the instruction's element size
  Both steps are defined independently of the implementation register layout, so the position-to-element mapping is identical on every implementation
  If one row of the row-major view is narrower than the element size, an `Illegal Instruction` exception is raised.
