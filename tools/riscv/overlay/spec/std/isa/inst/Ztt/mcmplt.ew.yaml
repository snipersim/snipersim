long_name: "Elementwise less-than compare"
description: |
  Elementwise less-than comparison of the tensors in `ms1` and `ms2`, stored into `md`
  + For standard datatypes, the sources are integer or floating-point and the destination is integer
  The comparison is ordered: a NaN operand makes it false, and `-0` compares equal to `+0`
