name: mcolunzip.ew
long_name: "Column unzip (de-interleave columns from two inputs)"
description: |
  De-interleaves the columns of the two-square logical source formed by the logical source square at `ms1` followed by the logical source square at `ms2`, and writes the two result squares back into `ms1` and `ms2`
  Each operand is both a source and a destination
  + Let `N = sqrt(AME_NELEM)`; `i` ranges over rows and `j` is in `[0, N/2)`
  `A` and `B` are the pre-instruction logical squares at `ms1` and `ms2`
  Even-indexed columns of the logical source are collected into `ms1`; odd-indexed columns into `ms2`
  Each of `ms1` and `ms2` contains exactly one logical square
  + `ms1` and `ms2` must name distinct M registers; an equal pair raises an `Illegal Instruction` exception before any register is read or written
  + The datatypes of `ms1` and `ms2` must match; if they differ, `amestatus.UN` is set and no register is written
  + After the instruction-specific source selection and result placement, every element is copied bit-for-bit in that common datatype representation
  This preserves floating-point NaN payloads and signed zeros, and all custom-datatype representations
  + Packed datatypes are unsupported and are handled according to <<norm:ame_op_supported_contract,the unsupported-datatype-tuple contract>>
  + Inverse of `mcolzip.ew`.
