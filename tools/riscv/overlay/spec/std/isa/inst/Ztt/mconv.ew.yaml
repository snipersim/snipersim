description: |
  Converts element data between supported datatypes
  + The source datatype is determined from `Md[ms1]` and the destination datatype from `Md[md]`
  The source and destination datatypes may each be a packed or a non-packed datatype; no particular packedness combination is required
  Both operands are formed by the common operand-formation rules, so the instruction's square count is `N_sq = max(pack_factor)` and every operand spans exactly `N_sq` squares
  + `mconv.ew` converts each element of the formed logical source operand from the source datatype to the destination datatype and writes the result squares to the formed logical destination operand
  A packed source with a non-packed destination therefore expands the source squares; a non-packed source with a packed destination compresses them; and operands with the same packedness convert each element without changing the square layout
  + Element conversion follows the common datatype conversion rules; unsupported conversion tuples set `amestatus.UN` and do not modify any register.
