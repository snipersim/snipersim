# RISC-V Sv39: a 3-level radix page table over a 39-bit virtual address space
# (4 KiB pages, 2 MiB megapages; each level indexes 512 entries).  Two page
# walk caches, for the two non-leaf levels.
#
# A guest has to live inside the 39-bit space for this to be its page table:
# QEMU user mode lays a riscv64 guest out over 48 bits by default, and
# run-sniper --frontend=qemu confines it with -R (see --qemu-va-bits); an
# address above the space is refused by the simulator rather than aliased.

[perf_model/mimicos_host]
page_table_type="radix"
page_table_name="radix_sv39"

[perf_model/mmu]
ptw_filter_type="pwc"

[perf_model/mimicos_host/radix_sv39]
page_sizes=2
page_size_list=12,21
levels=3
frame_size=512

[perf_model/mmu/pwc]
enabled=true
levels=2
entries=32,32
associativity=4,4
access_penalty=1
miss_penalty=1
