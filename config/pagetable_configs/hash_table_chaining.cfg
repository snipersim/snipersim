# Hashed page table with chaining: one table per page size, a 64-byte
# entry per aligned block of eight pages, collisions chained from the
# kernel region.  The page table's own keys sit under the OS that owns it,
# beside the radix table's (4_level_radix.cfg).

[perf_model/mimicos_host]
page_table_type="hash_table"
page_table_name="hash_table_chaining"

[perf_model/mmu]
ptw_filter_type="default"

[perf_model/mimicos_host/hash_table_chaining]
page_sizes=2
page_size_list=12,21
page_table_size_list=65536,256
resize_threshold=0.6  # Resize when 60% of root slots are occupied
resize_factor=2       # Double the table size on resize
