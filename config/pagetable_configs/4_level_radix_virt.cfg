# 4-level radix page tables for virtualised execution: one for the host OS
# (guest-physical -> host-physical) and one for the guest OS (guest-virtual ->
# guest-physical).  Each OS reads its page table under its own section; the
# guest one is only read when general/virtualized_environment = true.
# The host MMU's page walk caches are configured in mmu_configs/mmu_virt.cfg.

[perf_model/mimicos_host]
page_table_type="radix"
page_table_name="radix_4level_host"
range_table_type="btree" 
range_table_name="range_table_btree1"

[perf_model/range_table_btree1]
node_size=4096

[perf_model/mimicos_host/radix_4level_host]
page_sizes=2
page_size_list=12,21
levels=4    
frame_size=512

[perf_model/mimicos_guest]
page_table_type="radix"
page_table_name="radix_4level_guest"
range_table_type="btree" 
range_table_name="range_table_btree2"

[perf_model/range_table_btree2]
node_size=4096

[perf_model/mimicos_guest/radix_4level_guest]
page_sizes=2
page_size_list=12,21
levels=4    
frame_size=512
