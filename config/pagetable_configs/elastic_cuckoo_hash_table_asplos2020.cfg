# Elastic cuckoo page table [Skarlatos et al., Elastic Cuckoo Page Tables:
# Rethinking Virtual Memory Translation for Parallelism, ASPLOS 2020], after
# the code the authors released (https://github.com/dskarlatos/ElasticCuckooHashing).
# The MMU's walk filter is the Cuckoo Walk Cache over the PMD-level Cuckoo
# Walk Table.

[perf_model/mimicos_host]
page_table_type="elastic_cuckoo"
page_table_name="pt_elastic_cuckoo"

[perf_model/mmu]
ptw_filter_type="cwc"

[perf_model/mmu/cwc]
entries=64

[perf_model/mimicos_host/pt_elastic_cuckoo]
page_sizes=2
page_size_list=12,21
page_table_size_list=262144,262144
ways=2
rehash_threshold=0.7
scale=2
