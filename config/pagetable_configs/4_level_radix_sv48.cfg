# RISC-V Sv48: a 4-level radix page table over a 48-bit virtual address space
# (4 KiB pages, 2 MiB megapages; 512 entries a level) -- the same geometry as
# base.cfg's radix_4level, under the name the statistics report it by.  Pair it
# with run-sniper --qemu-va-bits=48, which leaves QEMU's default riscv64 layout
# in place; the riscv configurations model Sv39 (3_level_radix_sv39.cfg) and
# confine the guest to it.

[perf_model/mimicos_host]
page_table_type="radix"
page_table_name="radix_sv48"

[perf_model/mmu]
ptw_filter_type="pwc"

[perf_model/mimicos_host/radix_sv48]
page_sizes=2
page_size_list=12,21
levels=4
frame_size=512

[perf_model/mmu/pwc]
enabled=true
levels=3
entries=32,32,32
associativity=4,4,4
access_penalty=1
miss_penalty=1
