# The hashed page table of Hash, Don't Cache [Yaniv and Tsafrir,
# SIGMETRICS 2016]: open addressing with linear probing, one table per
# page size, a 64-byte entry per aligned block of eight pages.

[perf_model/mimicos_host]
page_table_type="hash_dont_cache"
page_table_name="pt_hash_hdc"

[perf_model/mmu]
ptw_filter_type="default"

[perf_model/mimicos_host/pt_hash_hdc]
page_sizes=2
page_size_list=12,21
page_table_size_list=65536,256
resize_threshold=0.6  # Resize when the table reaches 60% occupancy
resize_factor=2       # Double the table size on resize
