# Revelator without the reservation machinery: every data page is a 4KB
# frame at hash(VPN), every leaf page-table frame is at hash(VPN >> 9)
# within the kernel region, and whatever the hash cannot place falls back
# to a linear scan.  No swapping, no 2MB regions.
#
# Statistics are registered under memory_allocator_name, so the name is
# the counter prefix (revelator_simple.hash1_successful_data_allocations).

[perf_model/mimicos_host]
memory_allocator_type = "revelator_simple"
memory_allocator_name = "revelator_simple"
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[perf_model/revelator_simple]
number_of_hashes = 1
memory_size = 131072
kernel_size = 32768
max_order = 12
frag_type = "largepages"
# 1.0: nothing poisoned, so the hash placement is never blocked
target_fragmentation = 1.0
