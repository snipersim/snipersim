# Revelator with transparent huge pages.  A data fault first tries a hashed
# 2MB region (hash of the 2MB-aligned VPN), then a conventional THP
# reservation, then a hashed 4KB frame, then a linear scan; leaf page-table
# frames are hashed within the kernel region.  On every allocation it feeds
# its placement statistics back to the revelator_thp speculative engine,
# which is how that engine picks its prediction mode.
#
# Statistics are registered under memory_allocator_name, so the name is
# the counter prefix (revelator_thp.revelator_2mb_data_allocated).  The
# engine reads its own keys from the same section:
# spec_engine_configs/spec_engine_revelator_thp.cfg.

[perf_model/mimicos_host]
memory_allocator_type = "revelator_thp"
memory_allocator_name = "revelator_thp"
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[perf_model/revelator_thp]
number_of_hashes = 1
memory_size = 131072
kernel_size = 32768
max_order = 12
frag_type = "largepages"
# Fraction of a reserved 2MB region that has to be touched before it is
# promoted (the conventional THP stage; the hashed 2MB stage does not wait)
threshold_for_promotion = 0.5
# 1.0: nothing poisoned at either granularity, so the hash placements are
# never blocked.  Both are read: target_fragmentation for the 4KB map,
# target_thp_fragmentation for the 2MB map.
target_fragmentation = 1.0
target_thp_fragmentation = 1.0
