# The ASAP allocator [Margaritov et al., MICRO 2019]: the reservation-based
# THP allocator (reserve_thp) under ASAP's name and promotion threshold --
# a 2MB region is reserved on the first touch and promoted to a 2MB page once
# 30% of it is touched -- registering its counters as asap.*.  The FlexSeg
# starts fragmented, so with no 2MB region to reserve the pages come from the
# buddy 4KB by 4KB (four_kb_allocated).

[perf_model/mimicos_host]
memory_allocator_type = "asap"
memory_allocator_name = "asap"
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[perf_model/asap]
memory_size = 131072
target_fragmentation = 0.0 # 0.0: no 2MB region free at the start, the whole memory fragmented
kernel_size = 32768
max_order = 12
frag_type = "largepage"
threshold_for_promotion = 0.3
