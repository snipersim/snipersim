# Utopia allocator (Kanellopoulos et al., MICRO 2023): two RestSegs -- set-
# associative segments whose pages need no page table walk -- over a FlexSeg
# that is the reservation-based THP allocator on the buddy.  Allocation order:
# RestSeg-2MB, FlexSeg-THP, RestSeg-4KB, FlexSeg-4KB.
#
# RestSeg pages are translated by the Utopia MMU (mmu_configs/mmu_utopia.cfg)
# and get no page table entry; under any other MMU the Utopia fault handler
# maps them in the page table too, so only the placement is Utopia's.

[perf_model/mimicos_host]
memory_allocator_type = "utopia"
memory_allocator_name = "utopia"
page_fault_handler = "utopia"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[general]
# The Utopia fault handler: RestSeg pages skip the page table update under
# the Utopia MMU, FlexSeg pages update it as usual
exception_handler_type = "utopia"

[perf_model/utopia/restseg]
# RestSeg 0: 2 GB of 2MB pages, 8-way -> 128 sets
# RestSeg 1: 8 GB of 4KB pages, 8-way -> 262144 sets
# Both are carved from the kernel region (kernel_size below), with each core's
# tag and fingerprint arrays and the radix way tables after them.
size = 2048, 8192
page_size = 21, 12
assoc = 8, 8

[perf_model/utopia]
restsegs = 2

# Fingerprint bits (CRC-8 of the tag, 1-8) in the per-core fingerprint array,
# and whether the MMU reads it before the tag array
fingerprint_bits = 4
fingerprint_enabled = 1

# Adaptive RestSeg walk (Utopia MMU): once one RestSeg takes rsw_sequential_threshold
# of the hits after rsw_warmup_accesses hits, it is walked first and the other
# only on a miss; otherwise both are walked in parallel
adaptive_rsw_enabled = true
rsw_sequential_threshold = 0.90
rsw_warmup_accesses = 1000

# Memory in MB: 128 GB in all, the first 32 GB the kernel region
memory_size = 131072
kernel_size = 32768

# Maximum buddy order (2^12 pages = 16 MB)
max_order = 12

# Fragmentation of the FlexSeg at start-up (1.0 = none, 0.0 = everything
# fragmented into 4KB pages) and its pattern
target_fragmentation = 0.0
frag_type = "largepage"

# Legacy threshold migration (Utopia MMU): a FlexSeg page whose walks reach
# ptw_migration_threshold with dram_accesses_migration_threshold DRAM accesses
# is migrated into the 4KB RestSeg.  Off; the cost-based Top-K policy of
# mmu_utopia.cfg is the one in use.
legacy_migration_enabled = 0
ptw_migration_threshold = 2
dram_accesses_migration_threshold = 2

# Percent of a 2MB FlexSeg reservation that has to be touched before it is
# promoted to a 2MB page; 0 promotes on the first touch
thp_promotion_threshold = 0
