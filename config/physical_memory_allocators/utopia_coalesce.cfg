# The coalescing Utopia allocator: utopia.cfg's RestSegs and FlexSeg, with a
# 2MB-aligned region placed whole in one way of the 4KB RestSeg whenever that
# way is free in all 512 of its sets, and returned as one 2MB page
# (include/memory_management/physical_memory_allocators/utopia_hash_coalesce.h).

#include ./physical_memory_allocators/utopia.cfg

[perf_model/mimicos_host]
memory_allocator_type = "utopia_coalesce"
