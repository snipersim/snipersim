# NUMA-aware reservation-based THP allocator: the reserve_thp policy run
# per NUMA node.  Every node has its own buddy allocator and 2MB map; a
# fault picks a node by placement policy (local = the faulting core's
# node), reserves and promotes within it, and spills to another node only
# when it is full.  Page-table frames come from the faulting core's node's
# kernel region.
#
# Statistics are registered under memory_allocator_name
# (numa_reserve_thp.node0_allocs, numa_reserve_thp.local_allocs, ...).
#
# Layout: the nodes are laid out back to back from frame 0 with no global
# kernel prefix, each with its own kernel reservation at its start -- so
# node 0 is frames [0, 64GB) and node 1 [64GB, 128GB).  A scheme that puts
# the tiered DRAM controller in front of this (numa.cfg) has to give the
# controller the same ranges: see address_translation_schemes/baseline_numa_reserve_thp.cfg.

[perf_model/mimicos_host]
memory_allocator_type = "numa_reserve_thp"
memory_allocator_name = "numa_reserve_thp"
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[perf_model/numa_reserve_thp]
memory_size = 131072
kernel_size = 32768
max_order = 12
frag_type = "largepage"
threshold_for_promotion = 0.0
# 1.0 leaves the memory unfragmented (reserve_thp.cfg's 0.0 fragments all of
# it), so a fault can reserve a 2MB region on its node and the per-node
# reservation path is exercised as well as the per-node 4KB one.
target_fragmentation = 1.0
fragmentation_mode = "ratio"
target_free_2mb_pages = 0

# --- NUMA-specific knobs ---
num_numa_nodes = 2
# "local", "bind", "interleave", "preferred"
numa_policy = "local"
# Per-node utilization above which a fault spills to another node
utilization_threshold = 0.85
# Per-node capacity and kernel reservation in MB (one entry per node)
per_node_capacity_mb = "65536, 65536"
per_node_kernel_mb = "16384, 16384"
