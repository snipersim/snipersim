# Physical memory allocators for virtualised execution: the host OS hands out
# host-physical frames, the guest OS guest-physical ones.  Both are the
# baseline (buddy) allocator of baseline_allocator.cfg; the guest only exists
# when general/virtualized_environment = true, so its section is inert
# otherwise.

[perf_model/mimicos_host]
memory_allocator_type = "baseline"
memory_allocator_name = "baseline_allocator_host"
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[perf_model/baseline_allocator_host]
memory_size = 131072
target_fragmentation = 0.0 # 0.0 means that no large page is available, the whole memory is fragmented
kernel_size = 32768
max_order = 12
frag_type = "largepage"

[perf_model/mimicos_guest]
memory_allocator_type = "baseline"
memory_allocator_name = "baseline_allocator_guest"
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[perf_model/baseline_allocator_guest]
memory_size = 131072
target_fragmentation = 0.0 # 0.0 means that no large page is available, the whole memory is fragmented
kernel_size = 32768
max_order = 12
frag_type = "largepage"
