# Utopia allocator with a single 4KB RestSeg.  The FlexSeg starts fully
# fragmented (target_fragmentation = 0.0), so no 2MB reservation succeeds and
# every data page goes to the RestSeg until its set fills, then to the buddy.
# Same memory as utopia.cfg.

[perf_model/mimicos_host]
memory_allocator_type = "utopia"
memory_allocator_name = "utopia"
page_fault_handler = "utopia"
number_of_page_sizes = 1
page_size_list = 12
swap_enabled = false

[general]
exception_handler_type = "utopia"

[perf_model/utopia/restseg]
# 8 GB of 4KB pages, 8-way -> 262144 sets
size = 8192
page_size = 12
assoc = 8

[perf_model/utopia]
restsegs = 1
fingerprint_bits = 4
fingerprint_enabled = 1
adaptive_rsw_enabled = true
rsw_sequential_threshold = 0.90
rsw_warmup_accesses = 1000
memory_size = 131072
kernel_size = 32768
max_order = 12
target_fragmentation = 0.0
frag_type = "largepage"
legacy_migration_enabled = 0
ptw_migration_threshold = 2
dram_accesses_migration_threshold = 2
thp_promotion_threshold = 0
