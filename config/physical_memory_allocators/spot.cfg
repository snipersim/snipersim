# SpOT allocator: Speculative Offset-based Translation
# [Alverti et al., Enhancing and Exploiting Contiguity for Fast Memory
# Virtualization, ISCA 2020]
#
# The first fault in a VMA places the whole VMA in a free contiguous range
# and fixes its VA-PA offset; every later fault in the VMA is served at
# that offset while the frame is free.  VMAs come from the trace's .vma
# file (record-trace --vma): without one every fault gets a buddy page.

[perf_model/mimicos_host]
memory_allocator_type = "spot"
memory_allocator_name = "spot_allocator"
page_fault_handler = "spot"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[general]
exception_handler_type = "spot"

[perf_model/spot_allocator]
memory_size = 131072                         # 128 GiB
kernel_size = 32768                          # 32 GiB
max_order = 10
frag_type = "largepage"
target_fragmentation = 0.0                   # fraction of the 4 MiB blocks poisoned out of the contiguity map (sweeped 0.0 -> 1.0 in the paper)
predefined_allocation_threshold = 32         # offset-based allocations a VMA needs before the engine learns its offset (SpOT paper, p. 7)

# The SpOT engine's PC-indexed offset cache (SpOT paper, p. 8)
number_of_entries_bits = 5                   # log2(entries): 32 entries
number_of_ways = 4
number_of_sets = 8                           # 32 entries / 4 ways
