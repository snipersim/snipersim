# DDR4-2400 with the open_page address mapping
# ============================================
# Selects perf_model/dram/ddr/address_mapping = open_page
# (DramAddressMappingFactory); ddr4_2400.cfg selects xor and documents the
# alternatives but nothing shipped selected this one.
#
# This is a delta on ddr4_2400.cfg and does not stand alone: it changes the
# mapping and relies on that file for the DRAM organisation.  Configs are
# composed by layering.
#
# Usage:
#   run-sniper -cgainestown -cdram_configs/ddr4_2400 -cdram_configs/ddr4_2400_open_page

[perf_model/dram/ddr]
address_mapping = open_page

[perf_model/dram/ddr/open_page]
channel_bits = 1      # log2 of num_channels
rank_bits = 2         # log2 of num_ranks
bank_bits = 5         # log2 of num_banks
page_size_bits = 7    # log2 of dram_page_size
