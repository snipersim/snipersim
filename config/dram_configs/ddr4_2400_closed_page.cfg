# DDR4-2400 with the closed_page address mapping
# ==============================================
# Selects perf_model/dram/ddr/address_mapping = closed_page
# (DramAddressMappingFactory); ddr4_2400.cfg selects xor and documents the
# alternatives but nothing shipped selected this one.
#
# This is a delta on ddr4_2400.cfg and does not stand alone: it changes the
# mapping and relies on that file for the DRAM organisation.  Configs are
# composed by layering.
#
# Usage:
#   run-sniper -cgainestown -cdram_configs/ddr4_2400 -cdram_configs/ddr4_2400_closed_page

[perf_model/dram/ddr]
address_mapping = closed_page

[perf_model/dram/ddr/closed_page]
column_bits_shift = 2 # column bits above the block offset before the bank bits
