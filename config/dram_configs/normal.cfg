# Normally distributed DRAM latency
# =================================
# Selects perf_model/dram/type = normal (DramPerfModelNormal): the access
# latency is drawn from a normal distribution around perf_model/dram/latency
# with perf_model/dram/normal/standard_deviation, on top of the queue model.
# base.cfg documents the type but sets the deviation to 0, and no shipped config
# ever selected it.
#
# Usage:
#   run-sniper -cgainestown -cdram_configs/normal

[perf_model/dram]
type = normal
latency = 45                      # mean, in nanoseconds

[perf_model/dram/normal]
standard_deviation = 10           # in nanoseconds

[perf_model/dram/queue_model]
enabled = true
type = history_list
