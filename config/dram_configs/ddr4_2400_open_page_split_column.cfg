# DDR4-2400 with the open_page_split_column address mapping
# =========================================================
# Selects perf_model/dram/ddr/address_mapping = open_page_split_column
# (DramAddressMappingFactory); ddr4_2400.cfg selects xor and documents the
# alternatives but nothing shipped selected this one.
#
# This is a delta on ddr4_2400.cfg and does not stand alone: it changes the
# mapping and relies on that file for the DRAM organisation.  Configs are
# composed by layering.
#
# Usage:
#   run-sniper -cgainestown -cdram_configs/ddr4_2400 -cdram_configs/ddr4_2400_open_page_split_column

[perf_model/dram/ddr]
address_mapping = open_page_split_column

[perf_model/dram/ddr/open_page_split_column]
column_offset = 3     # low column bits kept below the bank bits
