# Read/Write DRAM — 2 controllers, 76.5 GB/s each
# ==================================================
# DDR5-4800 aggregate bandwidth (~153 GB/s) split across 2 controllers.
#
# A memory controller sits at a core, and only at the master node of a shared
# last-level cache (memory_manager.cc); without controller_positions the two
# go to cores 0 and n/2.  So the machine needs two last-level caches whose
# masters those are: gainestown at 8 cores (two sockets, each with an L3
# shared by four cores), or any base with a private last-level cache and at
# least 2 cores.  At 1 core, or at 4 under one shared L3, the run is refused.
#
# Usage:
#   run-sniper -n 8 -cgainestown -cdram_configs/readwrite_2ctrl_153gbps

[perf_model/dram]
num_controllers = 2
type = readwrite
latency = 55                        # DRAM access latency in ns
per_controller_bandwidth = 76.5     # GB/s per controller (153 / 2)

[perf_model/dram/queue_model]
enabled = true
type = history_list

[perf_model/dram/readwrite]
shared = true                       # Reads and writes contend on same bandwidth
