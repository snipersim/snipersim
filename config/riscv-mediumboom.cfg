int_div_latency = 12
fp_div_latency = 11
fp_muladd_latency = 4
fp_addsub_latency = 4
ime_cfg_latency = 1
ime_tile_load_latency = 1
ime_tile_store_latency = 1
ime_mma_int_latency = 8
ime_mma_int_issue_cycles = 4
ime_mma_fp_latency = 12
ime_mma_fp_issue_cycles = 4
ame_own_latency = 1
ame_cfg_latency = 1
ame_load_latency = 1
ame_store_latency = 1
ame_mma_latency = 8
ame_mma_issue_cycles = 4
ame_move_latency = 2
ame_ew_latency = 4
acc_task_latency = 1
acc_wait_latency = 1
v_cfg_latency = 1
v_load_latency = 1
v_store_latency = 1
v_fp_div_latency = 20
v_fp_muladd_latency = 4
v_fp_addsub_latency = 4
v_int_div_latency = 20
v_int_mul_latency = 4
v_int_alu_latency = 2
system_latency = 1
