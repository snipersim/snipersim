# LimitLESS directory
# ===================
# Selects perf_model/dram_directory/directory_type = limitless
# (DirectoryEntryLimitless): max_hw_sharers hardware pointers, and when they
# overflow the entry traps to software, charging software_trap_penalty cycles,
# and keeps the full sharer set from then on.  base.cfg lists the type and the
# penalty key but every shipped config is full_map.
# Run with more cores than max_hw_sharers for the trap to be reachable.
#
# Usage:
#   run-sniper -n 4 -cgainestown -cdirectory_configs/limitless

[perf_model/dram_directory]
directory_type = limitless
max_hw_sharers = 2      # hardware pointers before the software trap

[perf_model/dram_directory/limitless]
software_trap_penalty = 200   # cycles per trap (Chaiken explores 25-150)
