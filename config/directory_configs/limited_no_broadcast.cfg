# Limited-pointer directory without broadcast
# ===========================================
# Selects perf_model/dram_directory/directory_type = limited_no_broadcast
# (DirectoryEntryLimitedNoBroadcast): each entry tracks at most max_hw_sharers
# sharers; adding one more first invalidates an existing sharer.  base.cfg
# lists the type and the key but every shipped config is full_map.
# Run with more cores than max_hw_sharers for the limit to be reached.
#
# Usage:
#   run-sniper -n 4 -cgainestown -cdirectory_configs/limited_no_broadcast

[perf_model/dram_directory]
directory_type = limited_no_broadcast
max_hw_sharers = 2      # hardware pointers per entry
