# ARM Cortex-A55 (in-order, mobile little)
# ============================================================
# Auto-generated for the core-aggressiveness sweep.
# Sources: 7-CPU.com, Chips&Cheese, ARM TRMs, AndroidAuthority.
#
# Sniper modelling notes:
#   * in_order=True: rob-timer model is still used; in-order behaviour
#     is approximated by a tight ROB and narrow dispatch.
#   * outstanding_loads / outstanding_stores map to the LDQ / STQ.
#   * rs_entries maps to the integer scheduler.

#
# An ARM core: the cortex-a53 configuration (ARMv8 traces, the cortex-a53 core model
# and its latency tables, the a53 branch predictor, the ARM MMU and TLBs) with
# this core's widths, queues and caches over it.  These files used the
# Nehalem core model and the Pentium M predictor, so they were x86 cores with
# ARM sizes and could not run an ARM trace; run an AArch64 guest on them
# (record-trace with an aarch64 binary, or -c core_configs/cortex_a55 with --frontend=qemu).

#include cortex-a53

[core_debug]
name = "cortex_a55"

[perf_model/core]
frequency = 2.0
logical_cpus = 1
core_model = "cortex-a53"
type = "rob"

[perf_model/core/oneipc]
latency_cutoff = 1000

[perf_model/sync]
reschedule_cost = 800

[clock_skew_minimization/barrier]
quantum = 100

[perf_model/branch_predictor]
type = a53
mispredict_penalty = 8

[perf_model/core/rob_timer]
in_order = true
issue_contention = true
mlp_histogram = false
issue_memops_at_issue = true
outstanding_loads = 24
outstanding_stores = 12
store_to_load_forwarding = true
address_disambiguation = true
simultaneous_issue = true
commit_width = 2
rs_entries = 48

[perf_model/core/interval_timer]
dispatch_width = 2
window_size = 8

[dvfs]
transition_latency = 1000

[dvfs/simple]
cores_per_socket = 1

[power]
vdd = 0.9
technology_node = 10

## ---- Memory subsystem ---- ##

[perf_model/dram_directory]
total_entries = 16777216
associativity = 256

[perf_model/cache]
levels = 2
mshr_size = 8   # the bound on the miss-overlap table, not an MSHR count (the L2's MSHRs: l2_cache/outstanding_misses)

[perf_model/l1_dcache]
perfect = false
cache_size = 32
associativity = 4
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = "ip_stride"
outstanding_misses = 8

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l1_dcache/prefetcher/ip_stride]
allocate_on_miss = "false"
num_prefetches = 4
num_streams = 128
stop_at_page_boundary = "false"
lookahead = 8

[perf_model/l1_icache]
perfect = false
cache_size = 32
associativity = 4
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1

[perf_model/l2_cache]
# The A55's private L2; the L3 is the DynamIQ Shared Unit's, shared by the
# cluster, as the NUCA below (the shape of cortex_a720 and cortex_x4).  This
# file had a 1 KB stand-in L2 with no latency, which -- every level being
# inclusive in Sniper -- left the L1s about 1 KB of what they held.
outstanding_misses = 8   # MSHRs; this file gave the count as perf_model/cache/mshr_size, which is not one
cache_size = 128          # "L2 cache = 128 KB, 64 B/line, 4-WAY, PIPT" (7-cpu.com, Cortex-A55: Kryo 485 Silver, Snapdragon 855, 1780 MHz); the A55 has an optional private L2 of 64 to 256 KB
associativity = 4
data_access_time = 7      # 7-cpu.com: an 8-cycle L2 load-to-use, the L1-D's tag check (1) and this; a hit under perf_model_type = parallel costs the data time alone
tags_access_time = 3      # what a miss costs here before it goes on (not published; about a third of the hit, as the A53's 5 of 15)
prefetcher = "none"
writeback_time = 40
perf_model_type = parallel
writethrough = 0
shared_cores = 1
address_hash = "xor_mod"

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l2_cache/prefetcher/streamer]
allocate_on_miss = "true"
num_prefetches = 4
num_streams = 128
prefetch_front = 8
max_conf = 7
conf_thresh = 2

[perf_model/l2_cache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l2_cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/l2_cache/qbs]
attempts = 6

[perf_model/nuca]
enabled = "true"
address_hash = "xor_mod"
cache_size = 2048          # "L3 Cache = 2 MB, 64 B/line, ?-WAY, shared by all cores" (7-cpu.com, Snapdragon 855)
associativity = 16        # the DSU's L3 is 16-way set associative (Arm DynamIQ Shared Unit TRM)
replacement_policy = lru
tags_access_time = 8      # a NUCA hit costs tags + data in series (nuca_cache.cc): 24 cycles load-to-use ("L3 Cache Latency = 24 cycles", 7-cpu.com)
data_access_time = 12     # less the L1-D tag (1) and the L2 miss (3): 20 here, 8 + 12
bandwidth = 128

[perf_model/nuca/cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/nuca/cache/qbs]
attempts = 4

[perf_model/nuca/queue_model]
enabled = true
type = history_list

[perf_model/nuca/mplru]
mode = disabled
mpki_threshold = 10.0

[perf_model/nuca/mplru/controller]
enabled = false
epoch_instructions = 1000
tr_share_min = 0.01
rho_min = 0.02
meta_level_start = 2
meta_level_max = 15
data_pain_frac = 0.05
tr_gain_frac = 0.03
cooldown_epochs = 2
max_step_per_epoch = 1
ema_alpha = 0.2

[perf_model/cache_usage]
enabled = false

[perf_model/metadata]
shadow_cache_enabled = "false"
shadow_cache_size = 16
shadow_cache_associativity = 8
shadow_cache_hit_latency = 1
shadow_cache_miss_latency = 2
passthrough_loc = 2

[perf_model/mimicos_host]
enabled = "false"

[log]
enabled = false

[queue_model/basic]
moving_avg_enabled = "true"
moving_avg_type = "arithmetic_mean"
moving_avg_window_size = 1024
