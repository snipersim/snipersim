# Hashed perceptron branch predictor
# ==================================
# Sixteen 4K-entry weight tables indexed by the address XORed with the global
# history folded over geometric lengths 0..232, with a dynamic threshold
# (ChampSim's configuration; no knobs).
#
# Usage:
#   run-sniper -cgainestown -ccore_configs/hashed_perceptron_branch_predictor

[perf_model/branch_predictor]
type = hashed_perceptron
