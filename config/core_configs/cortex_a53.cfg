# ARM Cortex-A53 (in-order, embedded)
# ============================================================
# Auto-generated for the core-aggressiveness sweep.
# Sources: 7-CPU.com, Chips&Cheese, ARM TRMs, AndroidAuthority.
#
# Sniper modelling notes:
#   * in_order=True: rob-timer model is still used; in-order behaviour
#     is approximated by a tight ROB and narrow dispatch.
#   * outstanding_loads / outstanding_stores map to the LDQ / STQ.
#   * rs_entries maps to the integer scheduler.

#
# An ARM core: the cortex-a53 configuration (ARMv8 traces, the cortex-a53 core model
# and its latency tables, the a53 branch predictor, the ARM MMU and TLBs) with
# this core's widths, queues and caches over it.  These files used the
# Nehalem core model and the Pentium M predictor, so they were x86 cores with
# ARM sizes and could not run an ARM trace; run an AArch64 guest on them
# (record-trace with an aarch64 binary, or -c core_configs/cortex_a53 with --frontend=qemu).

#include cortex-a53

[core_debug]
name = "cortex_a53"

[perf_model/core]
frequency = 1.5
logical_cpus = 1
core_model = "cortex-a53"
type = "rob"

[perf_model/core/oneipc]
latency_cutoff = 1000

[perf_model/sync]
reschedule_cost = 800

[clock_skew_minimization/barrier]
quantum = 100

[perf_model/branch_predictor]
type = a53
mispredict_penalty = 8

[perf_model/core/rob_timer]
in_order = true
issue_contention = true
mlp_histogram = false
issue_memops_at_issue = true
outstanding_loads = 16
outstanding_stores = 8
store_to_load_forwarding = true
address_disambiguation = true
simultaneous_issue = true
commit_width = 2
rs_entries = 32

[perf_model/core/interval_timer]
dispatch_width = 2
window_size = 8

[dvfs]
transition_latency = 1000

[dvfs/simple]
cores_per_socket = 1

[power]
vdd = 0.9
technology_node = 14

## ---- Memory subsystem ---- ##

[perf_model/dram_directory]
total_entries = 16777216
associativity = 256

[perf_model/cache]
levels = 2
mshr_size = 8   # the bound on the miss-overlap table, not an MSHR count (the L2's MSHRs: l2_cache/outstanding_misses)

[perf_model/l1_dcache]
perfect = false
cache_size = 32
associativity = 4
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = "ip_stride"
outstanding_misses = 8

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l1_dcache/prefetcher/ip_stride]
allocate_on_miss = "false"
num_prefetches = 4
num_streams = 128
stop_at_page_boundary = "false"
lookahead = 8

[perf_model/l1_icache]
perfect = false
cache_size = 32
associativity = 2
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1

[perf_model/l2_cache]
# The A53 has no private L2: its level 2 is the cluster's shared L2, which
# the included cortex-a53 configuration models -- 512 KB, 16-way, 64 B lines,
# shared by the cluster's four cores, a 15-cycle load-to-use ("L2 Cache = 512
# KB, 64 B/line, 16-WAY, shared by all cores", "L2 Cache Latency = 15 cycles",
# 7-cpu.com, Cortex-A53 on an Amlogic S905) -- and those values are kept.
# This file had a 1 KB stand-in L2 with no latency, to put the shared cache in
# the NUCA below it; every level is inclusive in Sniper, so each eviction from
# 1 KB took the line out of the L1s too, and the 32 KB L1-D held about 1 KB
# (a64-loop, a 16 KB array: 3.21% of its L1-D accesses missed, 0.13% now).

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l2_cache/prefetcher/streamer]
allocate_on_miss = "true"
num_prefetches = 4
num_streams = 128
prefetch_front = 8
max_conf = 7
conf_thresh = 2

[perf_model/l2_cache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l2_cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/l2_cache/qbs]
attempts = 6

[perf_model/nuca]
enabled = "false"   # no L3: the cluster L2 above is the last level (A53 MPCore TRM: an L2 per cluster, no L3)
address_hash = "xor_mod"
cache_size = 128
associativity = 16
replacement_policy = lru
tags_access_time = 15
data_access_time = 19
bandwidth = 128

[perf_model/nuca/cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/nuca/cache/qbs]
attempts = 4

[perf_model/nuca/queue_model]
enabled = true
type = history_list

[perf_model/nuca/mplru]
mode = disabled
mpki_threshold = 10.0

[perf_model/nuca/mplru/controller]
enabled = false
epoch_instructions = 1000
tr_share_min = 0.01
rho_min = 0.02
meta_level_start = 2
meta_level_max = 15
data_pain_frac = 0.05
tr_gain_frac = 0.03
cooldown_epochs = 2
max_step_per_epoch = 1
ema_alpha = 0.2

[perf_model/cache_usage]
enabled = false

[perf_model/metadata]
shadow_cache_enabled = "false"
shadow_cache_size = 16
shadow_cache_associativity = 8
shadow_cache_hit_latency = 1
shadow_cache_miss_latency = 2
passthrough_loc = 2

[perf_model/mimicos_host]
enabled = "false"

[log]
enabled = false

[queue_model/basic]
moving_avg_enabled = "true"
moving_avg_type = "arithmetic_mean"
moving_avg_window_size = 1024
