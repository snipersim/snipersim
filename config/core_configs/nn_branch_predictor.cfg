# Neural-network branch predictor
# ===============================
# Selects perf_model/branch_predictor/type = nn: a small libtorch model trained
# on-line in batches, with a Pentium M predictor as the alternate that answers
# while a batch is still training.  Only built when the build has libtorch
# (SNIPER_ENABLE_TORCH, which defines HAS_LIBTORCH); without it the factory
# rejects the type with "Invalid branch predictor type".
#
# The values are those test/fft-nn has always passed on the command line.
#
# Usage:
#   run-sniper -cgainestown -ccore_configs/nn_branch_predictor

[perf_model/branch_predictor]
type = nn
batch_length = 32        # branches per training batch
learning_rate = 0.001
