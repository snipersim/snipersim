# Qualcomm Oryon (Snapdragon X Elite)
# ============================================================
# Auto-generated for the core-aggressiveness sweep.
# Sources: 7-CPU.com, Chips&Cheese, ARM TRMs, AndroidAuthority.
#
# Sniper modelling notes:
#   * in_order=False: rob-timer model is still used; in-order behaviour
#     is approximated by a tight ROB and narrow dispatch.
#   * outstanding_loads / outstanding_stores map to the LDQ / STQ.
#   * rs_entries maps to the integer scheduler.

#
# An ARM core: the cortex-a72 configuration (ARMv8 traces, the cortex-a72 core model
# and its latency tables, the tage branch predictor, the ARM MMU and TLBs) with
# this core's widths, queues and caches over it.  These files used the
# Nehalem core model and the Pentium M predictor, so they were x86 cores with
# ARM sizes and could not run an ARM trace; run an AArch64 guest on them
# (record-trace with an aarch64 binary, or -c core_configs/oryon_xelite with --frontend=qemu).

#include cortex-a72

[core_debug]
name = "oryon_xelite"

[perf_model/core]
frequency = 4.3
logical_cpus = 1
core_model = "cortex-a72"
type = "rob"

[perf_model/core/oneipc]
latency_cutoff = 1000

[perf_model/sync]
reschedule_cost = 800

[clock_skew_minimization/barrier]
quantum = 100

[perf_model/branch_predictor]
type = tage
mispredict_penalty = 12

[perf_model/core/rob_timer]
in_order = false
issue_contention = true
mlp_histogram = false
issue_memops_at_issue = true
outstanding_loads = 192
outstanding_stores = 56
store_to_load_forwarding = true
address_disambiguation = true
simultaneous_issue = true
commit_width = 9
rs_entries = 120

# The issue pipelines, for the cortex-a72 core model's port contention:
# Chips and Cheese, "Qualcomm's Oryon Core: A Long Time in the Making" (2024): six integer ALUs, two of them multiply, two branch, four 128-bit vector pipes, four AGUs any of which loads or stores.
# Shared load/store pipelines count once under load_store.
[perf_model/core/cortex_a72_ports]
branch = 2
integer = 4          # single-cycle
integer_multi = 2    # single- or multi-cycle (multiply, divide)
alu_on_multi = true  # which also take single-cycle ALU µOPs
fp_asimd = 4
load = 4
store = 4
load_store = 4

[perf_model/core/interval_timer]
dispatch_width = 8
window_size = 680

[dvfs]
transition_latency = 1000

[dvfs/simple]
cores_per_socket = 1

[power]
vdd = 0.85
technology_node = 4

## ---- Memory subsystem ---- ##

[perf_model/dram_directory]
total_entries = 16777216
associativity = 256

[perf_model/cache]
levels = 2
mshr_size = 72   # the bound on the miss-overlap table, not an MSHR count (the L2's MSHRs: l2_cache/outstanding_misses)

[perf_model/l1_dcache]
perfect = false
cache_size = 96
associativity = 6
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 4
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = "ip_stride"
outstanding_misses = 72

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l1_dcache/prefetcher/ip_stride]
allocate_on_miss = "false"
num_prefetches = 4
num_streams = 128
stop_at_page_boundary = "false"
lookahead = 8

[perf_model/l1_icache]
perfect = false
cache_size = 192
associativity = 6
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 4
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1

[perf_model/l2_cache]
# Oryon has no private L2: its level 2 is the cluster's shared L2.  This file
# had a 1 KB stand-in L2 with no latency and the shared cache as the NUCA;
# every level being inclusive in Sniper, the stand-in left the L1s about 1 KB
# of what they held.  The NUCA below is now the SoC's system level cache.
outstanding_misses = 72   # MSHRs; this file gave the count as perf_model/cache/mshr_size, which is not one
cache_size = 12288         # "three quad-core clusters, each with a 12 MB L2 cache" (Chips and Cheese, "Qualcomm's Oryon Core: A Long Time in the Making", X1E-80-100)
associativity = 12        # "12-way set associative" (HotHardware, "Qualcomm Snapdragon X: Oryon CPU And Adreno GPU Architectures Explored")
data_access_time = 19     # "a relatively fast L2 with 20 cycles of latency" (Chips and Cheese; Qualcomm, Hot Chips 2024: 15-20 cycles depending on the slice): the L1-D tag (1) and this
tags_access_time = 6      # what a miss costs here before it goes on (not published; about a third of the hit)
prefetcher = "none"
writeback_time = 40
perf_model_type = parallel
writethrough = 0
shared_cores = 4          # a quad-core cluster shares it; a run of fewer cores has it to itself
address_hash = "xor_mod"

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l2_cache/prefetcher/streamer]
allocate_on_miss = "true"
num_prefetches = 4
num_streams = 128
prefetch_front = 8
max_conf = 7
conf_thresh = 2

[perf_model/l2_cache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l2_cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/l2_cache/qbs]
attempts = 6

[perf_model/nuca]
enabled = "true"
address_hash = "xor_mod"
cache_size = 6144          # "a 6 MB System Level Cache (SLC) with a claimed latency of 26-29 ns" (Chips and Cheese, Oryon); shared with the GPU and NPU, which no run here has
associativity = 16        # not published
replacement_policy = lru
tags_access_time = 40     # 26-29 ns at 4.3 GHz is 112-125 cycles load-to-use; a NUCA hit costs tags + data (nuca_cache.cc),
data_access_time = 70     # so less the L1-D tag (1) and the L2 miss (6): 110 here, 25.6 ns, about 27 ns in all
bandwidth = 128

[perf_model/nuca/cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/nuca/cache/qbs]
attempts = 4

[perf_model/nuca/queue_model]
enabled = true
type = history_list

[perf_model/nuca/mplru]
mode = disabled
mpki_threshold = 10.0

[perf_model/nuca/mplru/controller]
enabled = false
epoch_instructions = 1000
tr_share_min = 0.01
rho_min = 0.02
meta_level_start = 2
meta_level_max = 15
data_pain_frac = 0.05
tr_gain_frac = 0.03
cooldown_epochs = 2
max_step_per_epoch = 1
ema_alpha = 0.2

[perf_model/cache_usage]
enabled = false

[perf_model/metadata]
shadow_cache_enabled = "false"
shadow_cache_size = 16
shadow_cache_associativity = 8
shadow_cache_hit_latency = 1
shadow_cache_miss_latency = 2
passthrough_loc = 2

[perf_model/mimicos_host]
enabled = "false"

[log]
enabled = false

[queue_model/basic]
moving_avg_enabled = "true"
moving_avg_type = "arithmetic_mean"
moving_avg_window_size = 1024
