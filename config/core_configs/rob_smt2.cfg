# ROB core with two SMT threads
# =============================
# Selects RobSmtPerformanceModel: perf_model/core/type = rob dispatches to the
# SMT variant of the ROB timer as soon as logical_cpus > 1.  Nothing shipped
# selected it -- smt2.cfg sets logical_cpus alone and the base cores it was
# layered on are interval cores, which have one SMT model for both cases.
#
# base.cfg carries no [perf_model/core/rob_timer] defaults, so the timer's keys
# are repeated here from rob.cfg; this fragment stands on a complete machine
# config on its own.
#
# Usage:
#   run-sniper -cgainestown -ccore_configs/rob_smt2

[perf_model/core]
type = rob
logical_cpus = 2

[perf_model/core/rob_timer]
in_order = false
issue_contention = true
mlp_histogram = false
issue_memops_at_issue = true
outstanding_loads = 48
outstanding_stores = 32
store_to_load_forwarding = true
address_disambiguation = true
rob_repartition = true          # repartition the ROB across the active SMT threads
simultaneous_issue = true       # both threads may issue in one cycle (SMT, not fine-grained MT)
commit_width = 128
rs_entries = 36

[perf_model/l1_dcache]
outstanding_misses = 10
