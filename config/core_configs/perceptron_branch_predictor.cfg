# Perceptron branch predictor
# ===========================
# Jimenez and Lin's perceptron predictor: a bias and one signed weight per
# global-history bit, trained when wrong or when |output| <= 1.93 h + 14.
# Both knobs are optional; these are the defaults.
#
# Usage:
#   run-sniper -cgainestown -ccore_configs/perceptron_branch_predictor

[perf_model/branch_predictor]
type = perceptron

[perf_model/branch_predictor/perceptron]
history_length = 24
num_perceptrons = 163
