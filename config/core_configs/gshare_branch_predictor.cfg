# gshare branch predictor
# ========================
# McFarling's gshare: 2-bit counters indexed by the branch address XORed with
# the global history.  Both knobs are optional; these are the defaults.
#
# Usage:
#   run-sniper -cgainestown -ccore_configs/gshare_branch_predictor

[perf_model/branch_predictor]
type = gshare

[perf_model/branch_predictor/gshare]
history_length = 14     # global history bits (1..63)
table_size = 16384      # counters, a power of two
