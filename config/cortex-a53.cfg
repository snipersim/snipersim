[general]
arch = armv8 # !
enable_icache_modeling = true
mode = 64 # !
syntax = default
#total_cores = 4 # !

[perf_model/core]
core_model = cortex-a53 # !
frequency = 1.51 # !
type = rob # !
logical_cpus = 1 # Number of SMT threads per core !

[perf_model/core/rob_timer]
address_disambiguation = false  # Allow loads to bypass preceding stores with an unknown address
commit_width = 2                      # Commit bandwidth (instructions per cycle), per SMT thread ?
in_order = true # !
issue_contention = true
issue_memops_at_issue = true  # Issue memops to the memory hierarchy at issue time (false = before dispatch)
mlp_histogram = false
outstanding_loads = 8 #?
outstanding_stores = 16 #?
rs_entries = 36
simultaneous_issue = true
store_to_load_forwarding = false

[perf_model/core/interval_timer]
dispatch_width = 2
window_size = 128

[perf_model/branch_predictor]
type = a53
mispredict_penalty = 7   # "Branch misprediction penalty = 7 cycles" (7-cpu.com, Cortex-A53, measured on an Amlogic S905)
size = 1024  # 2.1.1 of the technical reference manual ?
num_history_registers = 3

[perf_model/cache]
levels = 2 # !

# Translation: the TLBs the MMU builds (Cortex-A53).  These live under
# perf_model/mmu/tlb_level_*; the perf_model/itlb|dtlb|stlb keys this file used
# to carry were read by nothing, so every core got base.cfg's Intel TLBs.
# A53 TRM: 10-entry fully associative instruction and data micro-TLBs, a 512-entry 4-way main TLB, one walker; the main TLB's latency is an approximation of the TRM's 'variable number of cycles'.
[perf_model/mmu]
page_table_walkers = 1

# The walk cache: "4-way set-associative 64-entry walk cache", holding a
# stage 1 walk's result "up to but not including the last level" (Cortex-A53
# TRM, DDI 0500J, sections 5.1 and 5.2.4); base.cfg's was 32 entries.
# Modelled as 64 entries, 4-way, at each of the 4-level table's three
# non-leaf levels: the upper levels hold few distinct entries, so they hit
# about as the A53's single cache does when it skips them.
[perf_model/mmu/pwc]
enabled = true
levels = 3
entries = 64,64,64
associativity = 4,4,4

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 2

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 10
assoc = 10  # fully associative
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 0  # a hit is inside the L1-D's 3-cycle load-to-use (7-cpu.com's figure includes it); at 1, the MMU
                    # added it before the cache, and a pointer chase hitting the L1-D took 4 cycles a load

[perf_model/mmu/tlb_level_1/tlb2]
type = "Instruction"
size = 10
assoc = 10  # fully associative
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 512
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 3
replacement_policy = "lru"

[perf_model/l1_icache]
cache_block_size = 64 # !
cache_size = 32 # ! 
associativity = 2 # !
replacement_policy = random # !
writethrough = 0
perfect = false
passthrough = false
coherent = true
data_access_time = 2
tags_access_time = 1
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
next_level_read_bandwidth = 128 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite
prefetcher = none
address_hash = mask

[perf_model/l1_dcache]
cache_block_size = 64 # !
cache_size = 32 # in KB !
associativity = 4 # !
replacement_policy = random # !
prefetcher = a53prefetcher  #??
writethrough = 0 # !
perfect = false
passthrough = false
address_hash = mask
data_access_time = 3   # load-to-use: "L1 Data Cache Latency = 3 cycles" (7-cpu.com, Cortex-A53, measured on an Amlogic S905)
tags_access_time = 1
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
outstanding_misses = 3   # MSHRs: "Support for three outstanding data cache misses" (Arm Cortex-A53 MPCore TRM, DDI 0500J, r0p4, section 6.1)
next_level_read_bandwidth = 128 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = false
train_prefetcher_on_hit = false
delay_prefetcher = false

[perf_model/l1_dcache/prefetcher/a53prefetcher]
num_prefetches=3
pattern_length=100
consecutive_pattern_length=2

[perf_model/l1_dcache/prefetcher/simple]
flows = 8
flows_per_core = false
num_prefetches = 32
stop_at_page_boundary = true

[perf_model/l2_cache]
outstanding_misses = 44   # MSHRs: the cluster's read issuing capability allows, per core, 8 data and 3 instruction
                          # linefills (Arm Cortex-A53 MPCore TRM, DDI 0500J, Table 7-5 in section 7.3.1); this L2 is
                          # shared by four cores (shared_cores), so 4 x 11
cache_block_size = 64 # in bytes !
cache_size = 512 # in KB
associativity = 16 # !
replacement_policy = random # it cannot be found in the technical reference manual, so I will just asume that it's as the l1 cache
data_access_time = 10 # with the tags, a hit in 15 cycles: "L2 Cache Latency = 15 cycles" (7-cpu.com, Cortex-A53,
tags_access_time = 5  # measured on an Amlogic S905); was 25 + 5, the worst case of the TRM's RAM latency table
writeback_time = 0 # approx of 1.5 ns; 3 cycles at 2 GHz; Extra time required to write back data to a higher cache level
prefetcher = none # optional
next_level_read_bandwidth = 0 # 2 cycles at 2 GHz; Read bandwidth to next-level cache, in bits/cycle, 0 = infinite
writethrough = 0 # !
perfect = false
passthrough = false
address_hash = mask
dvfs_domain = core    # Clock domain: core or global
shared_cores = 4      # a cluster: the A53 cluster shares its L2 among up to four cores (TRM: 128 KB to 2 MB, one per cluster); a run of fewer cores has it to itself
perf_model_type = parallel

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = false

[perf_model/l2_cache/prefetcher/simple]
flows = 64
flows_per_core = true
num_prefetches = 8
stop_at_page_boundary = true

[caching_protocol]
type = parametric_dram_directory_msi
variant = mesi # moesi

[perf_model/dram_directory]
total_entries = 16384
locations = llc       # one directory slice at each L2, sized above it (total_entries is per slice); at the one memory controller, a single slice served every core and overflowed past four
associativity = 16
directory_type = full_map # Supported (full_map, limited_no_broadcast, limitless)

[perf_model/dram]
type = constant # DRAM performance model type: "constant" or a "normal" distribution
latency = 180 # In nanoseconds !
per_controller_bandwidth = 5 # In GB/s
num_controllers = 1 # one memory controller for the system (with -1 and interleaving 0 every core got its own, and the bandwidth grew with the core count)
controllers_interleaving = 0
chips_per_dimm = 8
dimms_per_controller = 4

[perf_model/sync]
reschedule_cost = 0 # In nanoseconds

[dvfs]
type = simple
transition_latency = 0 # In nanoseconds

# Address translation: base.cfg's 4-level radix table over a 48-bit space is
# also AArch64's with a 4 KiB granule (four levels of 512 entries, 4 KiB pages
# and 2 MiB blocks), so it stands as it is; the TLBs are set above.

[perf_model/core/arm]
# SVE vector length in bytes: the size of one SVE load or store to the
# memory hierarchy.  The Cortex-A53 has no SVE; QEMU's -cpu max gives the guest
# every extension, and record-trace sets the guest's vector length to this
# (sve-default-vector-length) so that glibc's SVE memcpy/strlen move what
# the model times.  128 bits, the Neon width.
sve_bytes = 16

[perf_model/baseline_allocator]
# MimicOS's physical memory: an edge system's 4 GiB with a 512 MiB kernel
# reservation, not base.cfg's server-sized 128 GiB and 32 GiB (which also
# made the buddy allocator's set-up take seconds of every run).  Sizes in MB.
memory_size = 4096
kernel_size = 512

[power]
# McPAT (run-sniper --power).  These cores ship in 16 to 28 nm processes; 22 nm
# is the smallest node McPAT 1.0 models (base.cfg's 45 nm is a Nehalem's).
technology_node = 22 # nm
