# Revelator speculative engine over the revelator_simple allocator, 4KB only.
#
# The engine reads its hash geometry from [perf_model/revelator] whatever the
# allocator is called (spec_engine_designs/revelator.cc), and the
# revelator_simple allocator's block is [perf_model/revelator_simple]: on
# its own this selector cannot start.  Virtuoso ships the engine's block as
# spec_engine_configs/revelator_engine_params.cfg; it is included here so
# that this fragment stands on the allocator alone.
#include ./spec_engine_configs/revelator_engine_params.cfg

[perf_model/mmu/spec]
type="revelator"

[perf_model/mimicos_host]
page_fault_handler = "default"
number_of_page_sizes = 1
page_size_list = 12
