# Revelator open-addressing speculative engine
# ============================================
# The open-addressing variant of Revelator: one hash gives the home frame
# and the engine then probes linearly from it, predicting probing_depth
# consecutive frames per translation instead of one frame per hash.
#
# It reads its memory geometry from [perf_model/revelator_open], which has
# to match the allocator's memory_size / kernel_size.  Probe 0 is the same
# CityHash placement the revelator_simple allocator uses for its first
# hash, so that allocator is the one whose frames it can predict (it only
# warns, rather than disabling itself, on any other).

[perf_model/mmu/spec]
type="revelator_open_addressing"

[perf_model/mimicos_host]
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21

[perf_model/revelator_open]
# Frames predicted per translation: the home frame and the next one
probing_depth = 2
memory_size = 131072
kernel_size = 32768
oracle = "false"
# 0 = data and page-table speculation, 1 = data only, 2 = page table only
type = 0
filter = false
perfect_filtering = false
