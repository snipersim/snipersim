# Revelator THP speculative engine
# ================================
# Revelator with transparent huge pages: predicts both a 4KB and a 2MB
# placement per translation until the allocator's feedback settles it on
# one mode (or deactivates it when fewer than half the frames are
# hash-placed).  It exits unless the allocator is the revelator_thp one,
# whose feedback hook is what drives those mode changes.
#
# Memory geometry and hash count are shared with the allocator through
# [perf_model/revelator_thp] (physical_memory_allocators/revelator_thp_alloc.cfg).

[perf_model/mmu/spec]
type="revelator_thp"

[perf_model/mimicos_host]
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21

[perf_model/revelator_thp]
number_of_hashes = 1
number_of_predictions = 1
memory_size = 131072
kernel_size = 32768
oracle = "false"
# 0 = data and page-table speculation, 1 = data only, 2 = page table only
type = 0
filter = false
perfect_filtering = false
