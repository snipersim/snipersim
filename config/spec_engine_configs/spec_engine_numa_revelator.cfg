# NUMA Revelator speculative engine
# =================================
# The NUMA-aware Revelator engine: per-node hash predictions, chosen by
# PTW-trained saturating counters with a NUMA hint table as the fallback.
# It reads the NUMA topology from [perf_model/dram/numa] (config/numa.cfg)
# and its hash geometry from [perf_model/revelator], which has to match the
# numa_revelator allocator's memory_size / kernel_size.

[perf_model/mmu/spec]
type="numa_revelator"

[perf_model/mimicos_host]
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21

# Hash / prediction knobs shared with the vanilla Revelator engine
[perf_model/revelator]
number_of_hashes = 1
number_of_predictions = 1
memory_size = 131072
kernel_size = 32768
oracle = "false"
type = 0
filter = false
perfect_filtering = false

# Engine-only knobs (all optional; these are the built-in defaults)
[perf_model/numa_revelator]
# PTW-driven saturating counters: buckets, increment on a match, decrement on
# a mismatch, and the top-1/top-2 gap that counts as confident
counter_entries = 4096
counter_delta_inc = 2
counter_delta_dec = 1
counter_confidence = 4
# Maximum number of NUMA nodes speculated over per translation
max_speculation_nodes = 2
