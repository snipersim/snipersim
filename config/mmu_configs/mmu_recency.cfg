
# MMU configuration with the Recency TLB prefetcher enabled.
# Same geometry as mmu_temporal_pte.cfg, so the prefetchers are
# compared on equal terms, but selecting "recency" in the prefetch queue.
#
# Keeps pages in an LRU-ordered pointer table and, on a miss, prefetches
# the neighbours of the faulting page in recency order -- the page used
# just before it and just after it.  The idea is that a traversal repeats
# the order in which it touched pages last time.

[perf_model/mmu]
type="default"
page_table_walkers=4
metadata_table_name="none"
count_page_fault_latency = "false"
correct_prediction_latency=4
misprediction_latency=10
page_size_prediction_enabled=false

# PTW per-access logging (disabled by default, enable for detailed analysis)
ptw_access_logging = false
ptw_access_logging_sample_rate = 100  # Log every Nth PTW access (1 = log all)


[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = true

[perf_model/mmu/pwc]
enabled=true
levels=3
entries=32,32,32
associativity=4,4,4
access_penalty=1
miss_penalty=1

# ── L1 TLBs ──────────────────────────────────────────────────────────

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

# ── L2 TLB ───────────────────────────────────────────────────────────

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size=2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 12

# ── Superpage predictor ──────────────────────────────────────────────

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

# ── TLB Prefetch Queue ──────────────────────────────────────────────

[perf_model/mmu/tlb_prefetch]
number_of_pqs = 1
level = 2

[perf_model/mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency = 1
page_size = 2
page_size_list = 12,21
assoc = 2
number_of_prefetchers = 1
prefetcher_list = "recency"

# The Recency TLB prefetcher ────────────────────────────────────────
#
# Values are those Virtuoso ships.  The factory reads every one with
# getInt()/getBoolean(), which exits on a missing key rather than
# defaulting, so the whole block has to be present.

[perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher]
page_shift                = 12
prefetch_same_recency     = "true"
prefetch_recency_minus_1  = "true"
prefetch_recency_plus_1   = "true"
prefetch_on_tlb_hit       = "false"
model_prefetch_walks      = "true"
consume_pq_on_hit         = "true"
model_pointer_chase       = "true"
