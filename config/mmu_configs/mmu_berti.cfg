
# MMU configuration with the Berti TLB prefetcher enabled.
# Same geometry as mmu_temporal_pte.cfg -- so the two prefetchers are
# compared on equal terms -- but selecting "berti" in the prefetch queue.
#
# Berti learns per-region VPN strides by pattern-matching a history of
# recent requests against the current page, then issues a burst of
# prefetches along the winning stride.  Unlike temporal_pte it keeps its
# state in its own tables rather than in spare PTE payload bits, so it
# needs no shadow-payload support from the page table.

[perf_model/mmu]
type="default"
page_table_walkers=4
metadata_table_name="none"
count_page_fault_latency = "false"
correct_prediction_latency=4
misprediction_latency=10
page_size_prediction_enabled=false

# PTW per-access logging (disabled by default, enable for detailed analysis)
ptw_access_logging = false
ptw_access_logging_sample_rate = 100  # Log every Nth PTW access (1 = log all)


[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = true

[perf_model/mmu/pwc]
enabled=true
levels=3
entries=32,32,32
associativity=4,4,4
access_penalty=1
miss_penalty=1

# ── L1 TLBs ──────────────────────────────────────────────────────────

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

# ── L2 TLB ───────────────────────────────────────────────────────────

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size=2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 12

# ── Superpage predictor ──────────────────────────────────────────────

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

# ── TLB Prefetch Queue ──────────────────────────────────────────────

[perf_model/mmu/tlb_prefetch]
number_of_pqs = 1
level = 2

[perf_model/mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency = 1
page_size = 2
page_size_list = 12,21
assoc = 2
number_of_prefetchers = 1
prefetcher_list = "berti"

# ── Berti configuration ─────────────────────────────────
#
# Values are those Virtuoso ships in mmu_base_prefetch.cfg.  The factory
# reads every one of these with getInt(), so all seven must be present --
# a missing key exits the simulator rather than falling back to a default.
#
#   region_bits      – log2(pages per region); 6 → 64 pages = 256KB
#   current_pages    – entries tracking regions currently being learned
#   prev_requests    – depth of the recent-request history searched for strides
#   record_pages     – entries retaining a learned stride after eviction
#   ip_table_entries – direct-mapped table indexed by the requesting PC
#   num_berti        – candidate strides kept per region
#   max_burst        – prefetches issued per demand access along the winner

[perf_model/mmu/tlb_prefetch/pq1/berti_prefetcher]
region_bits = 6
current_pages = 63
prev_requests = 1024
record_pages = 256
ip_table_entries = 1024
num_berti = 10
max_burst = 3
