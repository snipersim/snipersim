
# MMU configuration with the Agile TLB Prefetcher (ATP + SBFP) enabled.
# Same geometry as mmu_temporal_pte.cfg, so the prefetchers are
# compared on equal terms, but selecting "atp" in the prefetch queue.
#
# ATP picks among three child prefetchers (H2P, MASP, STP) with three
# saturating counters and a per-child fake prefetch queue, so the one
# that would have been right gets the credit.
#
# SBFP exploits the cache-line locality of PTEs: the seven leaf PTEs
# sharing a 64B line with the demand PTE cost nothing extra to fetch.
# A 14-entry free-distance table with 10-bit saturating counters tracks
# which of those distances pay off, trained from a 64-entry sampler FIFO.

[perf_model/mmu]
type="default"
page_table_walkers=4
metadata_table_name="none"
count_page_fault_latency = "false"
correct_prediction_latency=4
misprediction_latency=10
page_size_prediction_enabled=false

# PTW per-access logging (disabled by default, enable for detailed analysis)
ptw_access_logging = false
ptw_access_logging_sample_rate = 100  # Log every Nth PTW access (1 = log all)


[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = true

[perf_model/mmu/pwc]
enabled=true
levels=3
entries=32,32,32
associativity=4,4,4
access_penalty=1
miss_penalty=1

# ── L1 TLBs ──────────────────────────────────────────────────────────

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

# ── L2 TLB ───────────────────────────────────────────────────────────

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size=2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 12

# ── Superpage predictor ──────────────────────────────────────────────

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

# ── TLB Prefetch Queue ──────────────────────────────────────────────

[perf_model/mmu/tlb_prefetch]
number_of_pqs = 1
level = 2

[perf_model/mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency = 1
page_size = 2
page_size_list = 12,21
assoc = 2
number_of_prefetchers = 1
prefetcher_list = "atp"

# The Agile TLB Prefetcher (ATP + SBFP) ────────────────────────────────────────
#
# Values are those Virtuoso ships.  The factory reads every one with
# getInt()/getBoolean(), which exits on a missing key rather than
# defaulting, so the whole block has to be present.

[perf_model/mmu/tlb_prefetch/pq1/atp_prefetcher]
pq_size            = 64
sampler_size       = 64
fpq_size           = 16
fdt_counter_bits   = 10
fdt_threshold      = 100
enable_pref_bits   = 8
select1_bits       = 6
select2_bits       = 2
masp_entries       = 64
masp_assoc         = 4
page_shift         = 12
# MASP stride fan-out, VPN + (lookahead+i)*stride, matching ASP semantics.
# 1/1 reproduces the original single-step behaviour.
masp_lookahead     = 1
masp_degree        = 1
