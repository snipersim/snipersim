# This is a basic MMU Virt configuration file. It is used to configure the MMU model in Sniper.
#
# Virtualised execution: the guest MMU ("mmu", type virt) translates guest
# virtual addresses through the guest page table, and nests on the host MMU
# ("host_mmu", the default design) for every guest-physical address it touches,
# including the guest page-table frames themselves.  Both MMUs carry the TLB
# hierarchy and page-table walker set of mmu_base.cfg; the guest one has no
# page walk caches (the guest walk is not filtered), the host one keeps them.
#
# Needs general/virtualized_environment = true (which creates the guest OS)
# and a guest page table and allocator; address_translation_schemes/virt.cfg
# layers all of it.

[perf_model/mmu]
type="virt"
page_table_walkers=4
metadata_table_name="none"
count_page_fault_latency="false"
correct_prediction_latency=4 # Page size prediction correct latency
misprediction_latency=10 # Page size prediction misprediction latency
page_size_prediction_enabled=false # Enable page size prediction

# PTW per-access logging (disabled by default, enable for detailed analysis)
ptw_access_logging = false
ptw_access_logging_sample_rate = 100  # Log every Nth PTW access (1 = log all)

[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = false
pagesize_predictor_name = "superpage"

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size=2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 12
replacement_policy = "lru"

[perf_model/mmu/tlb_level_2/tlb1/chirp]
table_size = 1024
threshold = 2

[perf_model/superpage] # Superpage prediction based on  [Papadopoulou et al. Prediction-based superpage-friendly TLB designs HPCA 2015] https://ieeexplore.ieee.org/document/7056034
small_page_size = 12 # Small page size in bits
large_page_size = 21 # Large page size in bits
table_size = 2 # Number of entries in the superpage table

[perf_model/mmu/tlb_prefetch] 
level = 2 # TLB level the prefetch queue attaches to
number_of_pqs = 1 # Number of prefetch queues

[perf_model/mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency=1
number_of_prefetchers=1
assoc = 4
page_size = 2
page_size_list = 12,21
prefetcher_list="asp" # Arbitrary-Stride Prefetcher based on [Vavouliotis et al. Agile TLB Prefetching] 

[perf_model/mmu/tlb_prefetch/pq1/stride_prefetcher]
length=2

[perf_model/mmu/tlb_prefetch/pq1/asp_prefetcher]
table_size=16
prefetch_threshold=0
extra_prefetch="true"
lookahead=4
degree=3


# Host MMU

[perf_model/host_mmu]
type="default"
page_table_walkers=4
metadata_table_name="none"
count_page_fault_latency="false"
ptw_filter_type="pwc"
correct_prediction_latency=4 # Page size prediction correct latency
misprediction_latency=10 # Page size prediction misprediction latency
page_size_prediction_enabled=false # Enable page size prediction
ptw_access_logging = false
ptw_access_logging_sample_rate = 100

[perf_model/host_mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/host_mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = false
pagesize_predictor_name = "superpage"

[perf_model/host_mmu/pwc]
enabled=true
levels=4
entries=32,32,32,32
associativity=4,4,4,4
access_penalty=1
miss_penalty=1

[perf_model/host_mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/host_mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/host_mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/host_mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/host_mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/host_mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size=2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 12
replacement_policy = "lru"

[perf_model/host_mmu/tlb_level_2/tlb1/chirp]
table_size = 1024
threshold = 2

[perf_model/host_mmu/tlb_prefetch] 
level = 2 # TLB level the prefetch queue attaches to
number_of_pqs = 1 # Number of prefetch queues

[perf_model/host_mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency=1
number_of_prefetchers=1
assoc = 4
page_size = 2
page_size_list = 12,21
prefetcher_list="asp" # Arbitrary-Stride Prefetcher based on [Vavouliotis et al. Agile TLB Prefetching] 

[perf_model/host_mmu/tlb_prefetch/pq1/stride_prefetcher]
length=2

[perf_model/host_mmu/tlb_prefetch/pq1/asp_prefetcher]
table_size=16
prefetch_threshold=0
extra_prefetch="true"
lookahead=4
degree=3
