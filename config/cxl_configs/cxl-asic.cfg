# CXL ASIC Memory Profile
#
# Silicon-validated parameters for CXL ASIC memory expander
# Based on CXL-DMSim measurements (arXiv:2411.02282):
#   - Total latency: ~284ns (2.18x local DDR)
#   - Bandwidth: 82-83% of local DDR
#   - Backend: DDR5 4800 MT/s
#
# This is a delta on cxl.cfg and does not stand alone: it overrides a few
# keys and relies on that file for the rest.  Configs are composed by
# layering, not by including -- the parser has no include directive, and
# the line that used to be here aborted the simulator with
#   parser Error: include cxl.cfg
#
# Usage:
#   run-sniper -c<base> -ccxl_configs/cxl -ccxl_configs/cxl-asic

[perf_model/cxl]
device_type = asic

# CXL ASIC has optimized controller
device_protocol_latency = 15

# DDR5 backend
backend_dram_latency = 100
num_channels = 2

# ASIC achieves good bandwidth
link_bandwidth = 32.0

# Optimized queue depths
device_request_fifo_depth = 48
device_response_fifo_depth = 48
