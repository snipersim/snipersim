# Base System Configuration -- Userspace MimicOS Mode
# ===================================================
# Upstream Virtuoso's common_userspace.cfg: base_system_userspace.cfg plus
# the three keys the userspace schemes there rely on.  Ours layers on the
# existing fragment rather than repeating it, so the two cannot drift.
#
# In this mode page faults are handled by the userspace MimicOS process via
# message passing (context switch overhead modeled).
#include ./common_configs/base_system_userspace.cfg

[general]
exception_handler_type = "default"

[perf_model/mimicos_host]
# The sniper-space MimicOS is not the one serving faults here.
enabled = "false"

[traceinput]
# In userspace MimicOS mode the kernel (app 0) is always running: do not
# stop the simulation when the first non-kernel app finishes.
stop_with_first_app = false
