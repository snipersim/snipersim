# Sequential cache timing model
# =============================
# Selects perf_model/<cache>/perf_model_type = sequential on every level: the
# tag lookup and the data access are charged one after the other
# (CachePerfModelSequential) instead of overlapped (parallel, the default in
# every shipped machine config).
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/perf_model_sequential

[perf_model/l1_icache]
perf_model_type = sequential

[perf_model/l1_dcache]
perf_model_type = sequential

[perf_model/l2_cache]
perf_model_type = sequential

[perf_model/l3_cache]
perf_model_type = sequential
