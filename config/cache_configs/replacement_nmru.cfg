# L2 replacement policy: nmru
# ===========================
# Selects perf_model/l2_cache/replacement_policy = nmru (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_nmru

[perf_model/l2_cache]
replacement_policy = nmru
