# L2 replacement policy: round_robin
# ==================================
# Selects perf_model/l2_cache/replacement_policy = round_robin (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_round_robin

[perf_model/l2_cache]
replacement_policy = round_robin
