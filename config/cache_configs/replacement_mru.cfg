# L2 replacement policy: mru
# ==========================
# Selects perf_model/l2_cache/replacement_policy = mru (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_mru

[perf_model/l2_cache]
replacement_policy = mru
