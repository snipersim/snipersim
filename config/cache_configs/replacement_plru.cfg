# L2 replacement policy: plru
# ===========================
# Selects perf_model/l2_cache/replacement_policy = plru (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_plru

[perf_model/l2_cache]
replacement_policy = plru
