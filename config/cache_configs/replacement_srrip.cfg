# L2 replacement policy: srrip
# ============================
# Selects perf_model/l2_cache/replacement_policy = srrip (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
# CacheSetSRRIP reads its RRIP width and the TLB flag from under the cache's own
# section.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_srrip

[perf_model/l2_cache]
replacement_policy = srrip

[perf_model/l2_cache/srrip]
bits = 2              # RRPV width: insert at 2^bits-2, evict at 2^bits-1
tlb_enabled = false   # the TLB-aware insertion path is for TLB sets only
