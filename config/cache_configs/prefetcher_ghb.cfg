# GHB stride prefetcher on the L2
# ===============================
# Selects perf_model/l2_cache/prefetcher = ghb, the global-history-buffer
# prefetcher (GhbPrefetcher).  prefetcher.cfg carries these keys but selects
# the simple next-line prefetcher; this is the other choice.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/prefetcher_ghb

[perf_model/l2_cache]
prefetcher = ghb

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true   # also prefetch on hits to prefetched lines

[perf_model/l2_cache/prefetcher/ghb]
width = 2             # prefetches per trigger
depth = 2             # how far down the stride chain to go
ghb_size = 512        # entries in the global history buffer
ghb_table_size = 512  # entries in the index table
