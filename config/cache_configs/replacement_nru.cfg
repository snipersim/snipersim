# L2 replacement policy: nru
# ==========================
# Selects perf_model/l2_cache/replacement_policy = nru (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_nru

[perf_model/l2_cache]
replacement_policy = nru
