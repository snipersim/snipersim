# L2 replacement policy: srrip_qbs
# ================================
# Selects perf_model/l2_cache/replacement_policy = srrip_qbs (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
# SRRIP with query-based selection: the victim is checked against the cores'
# private caches up to qbs/attempts times before the last candidate is forced
# (see llc-qbs.cfg for the same on the L3 with lru_qbs).
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_srrip_qbs

[perf_model/l2_cache]
replacement_policy = srrip_qbs
writeback_time = 10   # cost of a failed QBS query

[perf_model/l2_cache/srrip]
bits = 2
tlb_enabled = false

[perf_model/l2_cache/qbs]
attempts = 2          # candidates considered; the last one is forced
