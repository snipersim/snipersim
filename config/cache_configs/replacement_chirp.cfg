# L2 replacement policy: chirp
# ============================
# Selects perf_model/l2_cache/replacement_policy = chirp (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
# CHiRP, the dead-block predictor driven policy: predicted-dead lines are
# evicted first and lines predicted dead on fill bypass to LRU position.  Its
# table size and threshold are optional keys (defaults 1024 and 2); the policy
# registers chirp-* counters under the cache's name.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_chirp

[perf_model/l2_cache]
replacement_policy = chirp

[perf_model/l2_cache/chirp]
table_size = 1024     # dead-block predictor entries
threshold = 2         # confidence needed to call a block dead
