# L2 replacement policy: mplru
# ============================
# Selects perf_model/l2_cache/replacement_policy = mplru (CacheSet::parsePolicyType);
# the other levels keep the base config's lru.
# Metadata-protecting PLRU: page-table (metadata) lines are protected from
# eviction by data lines, always or adaptively on the MPKI threshold.  The
# policy registers mplru-* counters under the cache's name.
#
# Usage:
#   run-sniper -cgainestown -ccache_configs/replacement_mplru

[perf_model/l2_cache]
replacement_policy = mplru

[perf_model/l2_cache/mplru]
mode = always         # always | adaptive | anything else = plain PLRU
mpki_threshold = 5.0  # adaptive mode: protect metadata above this L2 MPKI
