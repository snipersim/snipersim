# Configuration file for the Sniper simulator

# This file is organized into sections defined in [] brackets as in [section].
# Sections may be hierarchical withsub-sections split by the '/' character as
# in [section/sub_section].
#
# values can be "strings" , numbers, or true/false, existing values
# should indicate the type

# This section controls various high-level simulation parameters.
[general]
arch = intel
mode = 64
magic = false # Enable performance simulation straight away (false), or wait for Roi{Begin,End} magic instruction (true)
roi_script = false # Allow ROI to be set by a script, and ignore Roi{Begin,End} magic instructions
inst_mode_init = cache_only
inst_mode_roi = detailed
inst_mode_end = fast_forward
inst_mode_output = true
syntax = intel # Disassembly syntax (intel, att or xed)
issue_memops_at_functional = false # Issue memory operations to the memory hierarchy as they are executed functionally (Pin front-end only)
num_host_cores = 0 # Number of host cores to use (approximately). 0 = autodetect based on available cores and cpu mask. -1 = no limit (oversubscribe)
signals_to_ignore = 13 # SIGPIPE = 13
enable_smc_support = false # Support self-modifying code

# Memory-management defaults.  These keys are read unconditionally by the
# simulator but were only ever set in common_configs/base_system_sniperspace.cfg
# and common_configs/base_system_userspace.cfg, so every config that does not
# include one of those -- gainestown, nehalem, the cortex-a* configs, and the
# rest of the shipped set -- failed to load with a bare
#   *** Configuration error *** Configuration value general/<key> not found.
# The values here match base_system_sniperspace.cfg; both common_configs files
# still override them.
enable_userspace_mimicos = false # Run MimicOS in userspace rather than simulator space
native_environment = "true" # Running on a real machine rather than a VM
virtualized_environment = "false" # Running on a VM rather than a real machine
translation_enabled = "true" # Model address translation in each core
exception_handler_type = "default"
enable_pinplay = false # Run with a pinball instead of an application (requires a Pin kit with PinPlay support)
enable_syscall_emulation = true # Emulate system calls, cpuid, rdtsc, etc. (disable when replaying Pinballs)
suppress_stdout = false # Suppress the application's output to stdout
suppress_stderr = false # Suppress the application's output to stderr

# Total number of cores in the simulation
total_cores = 64

enable_icache_modeling = false

# MMU, page-table and physical-allocator defaults.
#
# These keys are read unconditionally by the simulator but were only ever set in
# config/mmu_configs/, config/pagetable_configs/ and
# config/physical_memory_allocators/.  Every complete config predating the MimicOS
# work -- gainestown, nehalem, nehalem-lite, beckton, dunnington, dunnington16,
# silvermont, riscv-mediumboom -- therefore stopped loading with
#   *** Configuration error *** Configuration value perf_model/mmu/type not found.
# and a chain of similar errors behind it.
#
# The values below are copied verbatim from those files, which remain the place to
# edit them; configs that include them again (the address_translation_schemes set)
# are unaffected, and any config may override individual keys as usual.
# #include is not expanded for base.cfg itself -- run-sniper resolves includes for
# the config named with -c, but passes base.cfg straight through -- so these are
# inlined rather than included.

# ---- from config/mmu_configs/mmu_base.cfg ----
# This is a basic MMU configuration file. It is used to configure the MMU model in Sniper.
# We have a with a TLB subsystem and 4 page table walkers.
# The TLB subsystem has two levels of TLBs.

# Simple schematic: 

# 1st level TLBs: L1 TLB (Data for 4KB pages), L1 TLB (Data for 2MB pages), L1 TLB (Instruction)
# 2nd level TLBs: L2 TLB (Unified for 4KB and 2MB pages) 

# On a TLB miss, there are 4 page table walkers that can be used to walk the page table.

[perf_model/mmu]
type="default"
page_table_walkers=4
metadata_table_name="none"
count_page_fault_latency = "false" # TODO @vlnitu: discuss w/ @kanellok if OK
# Not in mmu_base.cfg; common_configs/base_system_*.cfg set it to true.  Default to
# false here so legacy configs do not silently acquire per-access checking they
# never had -- the maintained configs still turn it on explicitly.
sanity_checks_enabled = false
correct_prediction_latency=4 # Page size prediction correct latency
misprediction_latency=10 # Page size prediction misprediction latency
page_size_prediction_enabled=false # Enable page size prediction

# PTW per-access logging (disabled by default, enable for detailed analysis)
ptw_access_logging = false
ptw_access_logging_sample_rate = 100  # Log every Nth PTW access (1 = log all)


[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = false

[perf_model/mmu/pwc]
enabled=true
levels=3
entries=32,32,32
associativity=4,4,4
access_penalty=1
miss_penalty=1


[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size=2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 12
replacement_policy = "lru"

[perf_model/mmu/tlb_level_2/tlb1/chirp]
table_size = 1024
threshold = 2


[perf_model/superpage] # Superpage prediction based on  [Papadopoulou et al. Prediction-based superpage-friendly TLB designs HPCA 2015] https://ieeexplore.ieee.org/document/7056034
small_page_size = 12 # Small page size in bits
large_page_size = 21 # Large page size in bits
table_size = 2 # Number of entries in the superpage table

[perf_model/mmu/tlb_prefetch] 
level = 2 # TLB level the prefetch queue attaches to
number_of_pqs = 1 # Number of prefetch queues

[perf_model/mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency=1
number_of_prefetchers=1
assoc = 4
page_size = 2
page_size_list = 12,21
prefetcher_list="asp" # Arbitrary-Stride Prefetcher based on [Vavouliotis et al. Agile TLB Prefetching] 

[perf_model/mmu/tlb_prefetch/pq1/stride_prefetcher]
length=2

[perf_model/mmu/tlb_prefetch/pq1/asp_prefetcher]
table_size=16
prefetch_threshold=0
extra_prefetch="true"
lookahead=4
degree=3

# ---- from config/pagetable_configs/4_level_radix.cfg ----
# 4-level radix page table configuration. 
# This configuration includes 3 page walk caches, each with 32 entries and associativity of 4.

[perf_model/mimicos_host]
page_table_type="radix"
page_table_name="radix_4level"

[perf_model/mmu]
ptw_filter_type="pwc"

[perf_model/mimicos_host/radix_4level]
page_sizes=2
page_size_list=12,21
levels=4    
frame_size=512

# ---- from config/pagetable_configs/range_table.cfg ----
[perf_model/mimicos_host]
range_table_type="btree" 
range_table_name="range_table_btree"

[perf_model/range_table_btree]
node_size=4096

# ---- from config/physical_memory_allocators/baseline_allocator.cfg ----
[perf_model/mimicos_host]
memory_allocator_type = "baseline"
memory_allocator_name = "baseline_allocator"
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = false

[perf_model/baseline_allocator]
memory_size = 131072
target_fragmentation = 0.0 # 0.0 means that no large page is available, the whole memory is fragmented
kernel_size = 32768
max_order = 12
frag_type = "largepage"
 

# ---- from config/core_configs/meteor_lake_pcore.cfg ----
[perf_model/metadata]
shadow_cache_enabled = "false"
shadow_cache_size = 16
shadow_cache_associativity = 8
shadow_cache_hit_latency = 1
shadow_cache_miss_latency = 2
passthrough_loc = 2

# ---- from config/common_configs/base_system_sniperspace.cfg ----
[perf_model/mimicos_host]
enabled = "false"
page_fault_latency = 0

[perf_model/dram/numa]
enabled = false

# CXL memory model off by default; config/cxl_configs/ turns it on.
[perf_model/cxl]
enabled = false

# Read unconditionally by the cache controller but only ever set in
# core_configs/meteor_lake_pcore.cfg, so the classic per-machine configs could
# not load.  Same value as that file.
[perf_model/cache]
mshr_size = 80   # not an MSHR count: the bound on each cache's table of recent misses, used to find
                 # an access that overlaps one in flight.  The MSHRs are l1_dcache/l2_cache outstanding_misses

# This section is used to fine-tune the logging information. The logging may
# be disabled for performance runs or enabled for debugging.
[log]
enabled = false
disabled_modules = ""
enabled_modules = ""
mutex_trace = false
circular_log = false

[progress_trace]
enabled = false
interval = 5000
filename = ""

[clock_skew_minimization]
scheme = barrier
report = false

[clock_skew_minimization/barrier]
quantum = 100                         # Synchronize after every quantum (ns)

# This section describes parameters for the core model
[perf_model/core]
frequency = 1        # In GHz
type = rob           # Valid models are rob (the default: every configuration uses it unless it says
                     # otherwise), interval (layer config/interval.cfg) and oneipc (fast-forward, cache-only)
logical_cpus = 1     # Number of SMT threads per core

[perf_model/core/interval_timer]
#dispatch_width = 4
#window_size = 96
issue_contention = true
memory_dependency_granularity = 8 # In bytes
lll_dependency_granularity = 64 # In bytes. Model the MSHR for overlapping misses by adding additional dependencies on long-latency loads using cache-line granularity
lll_cutoff = 30
issue_memops_at_dispatch = false # Issue memory operations to the cache hierarchy at dispatch (true) or at fetch (false)

# This section describes the number of cycles for
# various arithmetic instructions.
# The ROB model's defaults (the default core model; a configuration overrides
# what it knows of its core).  Its window and width are interval_timer's
# window_size and dispatch_width, its L1-D MSHRs l1_dcache/outstanding_misses.
[perf_model/core/rob_timer]
in_order = false
issue_contention = true
mlp_histogram = false           # Collect histogram of memory-level parallelism (slow)
issue_memops_at_issue = true    # Issue memops to the memory hierarchy at issue time (false = before dispatch)
outstanding_loads = 48
outstanding_stores = 32
store_to_load_forwarding = true # Forward data to loads from stores that are still in the store buffer
address_disambiguation = true   # Allow loads to bypass preceding stores with an unknown address
rob_repartition = true          # For SMT model with static ROB partitioning, whether to repartition the ROB
                                # across all active threads (true), or keep everyone fixed at a 1/nthreads share (false)
simultaneous_issue = true       # Whether two different threads can execute in a single cycle. true = simultaneous multi-threading, false = fine-grained multi-threading
commit_width = 128              # Commit bandwidth (instructions per cycle), per SMT thread
rs_entries = 36

# When issue_memops_at_issue is enabled, memory issue times will be correct and the memory subsystem can enable more detailed modeling

[perf_model/core/static_instruction_costs]
add=1
sub=1
mul=3
div=18
page_fault=0
fadd=3
fsub=3
fmul=5
fdiv=6
generic=1
jmp=1
string=1
branch=1
dynamic_misc=1
recv=1
sync=0
spawn=0
tlb_miss=0
mem_access=0
delay=0
unknown=0

[perf_model/branch_predictor]
type=one_bit
mispredict_penalty=14 # A guess based on Penryn pipeline depth
size=1024

[perf_model/tlb]
# Penalty of a page walk (in cycles)
penalty = 0
# Page walk is done by separate hardware in parallel to other core activity (true),
# or by the core itself using a serializing instruction (false, e.g. microcode or OS)

[perf_model/itlb]
size = 0              # Number of I-TLB entries
associativity = 1     # I-TLB associativity

[perf_model/dtlb]
size = 0              # Number of D-TLB entries
associativity = 1     # D-TLB associativity

[perf_model/stlb]
size = 0              # Number of second-level TLB entries
associativity = 1     # S-TLB associativity

[perf_model/l1_icache]
perfect = false
passthrough = false
coherent = true
cache_block_size = 64
cache_size = 32 # in KB
associativity = 4
address_hash = mask
replacement_policy = lru
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
next_level_read_bandwidth = 0 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite
prefetcher = none

[perf_model/l1_dcache]
perfect = false
passthrough = false
cache_block_size = 64
cache_size = 32 # in KB
associativity = 4
address_hash = mask
replacement_policy = lru
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
# outstanding_misses: the L1-D's MSHRs, used by both core models.  No default: every
# configuration states its core's count (0, no limit, is refused at start-up).
next_level_read_bandwidth = 0 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite
prefetcher = none

[perf_model/l2_cache]
outstanding_misses = 32   # MSHRs: line misses that go past the L2 at a time (the default; a configuration
                          # sets its core's documented count; 0, no limit, is refused at start-up)
perfect = false
passthrough = false
cache_block_size = 64 # in bytes
cache_size = 512 # in KB
associativity = 8
address_hash = mask
replacement_policy = lru
data_access_time = 9
tags_access_time = 3  # This is just a guess for Penryn
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
prefetcher = none     # Prefetcher type
next_level_read_bandwidth = 0 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite

[perf_model/l3_cache]
perfect = false
passthrough = false

[perf_model/l4_cache]
perfect = false
passthrough = false

[perf_model/llc]
evict_buffers = 8

[perf_model/fast_forward]
model = oneipc        # Performance model during fast-forward (none, oneipc)

[perf_model/fast_forward/oneipc]
interval = 100000     # Barrier quantum in fast-forward, in ns
include_memory_latency = true # Increment time by memory latency
include_branch_misprediction = false # Increment time on branch misprediction

[core]
spin_loop_detection = false

[core/light_cache]
num = 0

[core/cheetah]
enabled = false
min_size_bits = 10
max_size_bits_local = 30
max_size_bits_global = 36

[core/hook_periodic_ins]
ins_per_core = 10000  # After how many instructions should each core increment the global HPI counter
ins_global = 1000000  # Aggregate number of instructions between HOOK_PERIODIC_INS callbacks

[caching_protocol]
type = parametric_dram_directory_msi
variant = mesi                            # msi, mesi or mesif

[perf_model/dram_directory]
total_entries = 16384
associativity = 16
max_hw_sharers = 64                       # number of sharers supported in hardware (ignored if directory_type = full_map)
directory_type = full_map                 # Supported (full_map, limited_no_broadcast, limitless)
home_lookup_param = 6                     # Granularity at which the directory is stripped across different cores
directory_cache_access_time = 10          # Tag directory lookup time (in cycles)
locations = dram                          # dram: at each DRAM controller, llc: at master cache locations, interleaved: every N cores (see below)
interleaving = 1                          # N when locations=interleaved

[perf_model/dram_directory/limitless]
software_trap_penalty = 200               # number of cycles added to clock when trapping into software (pulled number from Chaiken papers, which explores 25-150 cycle penalties)

[perf_model/dram]
type = constant                           # DRAM performance model type: "constant" or a "normal" distribution
latency = 100                             # In nanoseconds
per_controller_bandwidth = 5              # In GB/s
num_controllers = -1                      # Total Bandwidth = per_controller_bandwidth * num_controllers
controllers_interleaving = 0              # If num_controllers == -1, place a DRAM controller every N cores
controller_positions = ""
direct_access = false                     # Access DRAM controller directly from last-level cache (only when there is a single LLC)

[perf_model/dram/normal]
standard_deviation = 0                    # The standard deviation, in nanoseconds, of the normal distribution

[perf_model/dram/cache]
enabled = false

[perf_model/dram/queue_model]
enabled = true
type = history_list

[perf_model/nuca]
enabled = false

[perf_model/sync]
reschedule_cost = 0 # In nanoseconds

# This describes the various models used for the different networks on the core
[network]
# Valid Networks :
# 1) magic
# 2) emesh_hop_counter, emesh_hop_by_hop
# 3) bus
memory_model_1 = emesh_hop_counter
system_model = magic
collect_traffic_matrix = false

[network/emesh_hop_counter]
link_bandwidth = 64 # In bits/cycles
hop_latency = 2

[network/emesh_hop_by_hop]
link_bandwidth = 64   # In bits/cycle
hop_latency = 2       # In cycles
concentration = 1     # Number of cores per network stop
dimensions = 2        # Dimensions (1 for line/ring, 2 for 2-D mesh/torus)
wrap_around = false   # Use wrap-around links (false for line/mesh, true for ring/torus)
size = ""             # ":"-separated list of size for each dimension, default = auto

[network/emesh_hop_by_hop/queue_model]
enabled = true
type = history_list
[network/emesh_hop_by_hop/broadcast_tree]
enabled = false

[network/bus]
ignore_local_traffic = true # Do not count traffic between core and directory on the same tile

[network/bus/queue_model]
type=contention

[queue_model/basic]
moving_avg_enabled = true
moving_avg_window_size = 1024
moving_avg_type = arithmetic_mean

[queue_model/history_list]
# Uses the analytical model (if enabled) to calculate delay if cannot be calculated using the history list
max_list_size = 100
analytical_model_enabled = true

[queue_model/windowed_mg1]
window_size = 1000        # In ns. A few times the barrier quantum should be a good choice

[dvfs]
type = simple
transition_latency = 0 # In nanoseconds

[dvfs/simple]
cores_per_socket = 1

[bbv]
sampling = 0 # Defines N to skip X samples with X uniformely distributed between 0..2*N, so on average 1/N samples

[loop_tracer]
#base_address = 0 # Start address in hex (without 0x)
iter_start = 0
iter_count = 36

[osemu]
pthread_replace = false   # Emulate pthread_{mutex|cond|barrier} functions (false: user-space code is simulated, SYS_futex is emulated)
nprocs = 0                # Overwrite emulated get_nprocs() call (default: return simulated number of cores)
clock_replace = true      # Whether to replace gettimeofday() and friends to return simulated time rather than host wall time
time_start = 1337000000   # Simulator startup time ("time zero") for emulated gettimeofday()

[traceinput]
enabled = false
address_randomization = false # Randomize upper address bits on a per-application basis to avoid cache set contention when running multiple copies of the same trace
stop_with_first_app = true    # Simulation ends when first application ends (else: when last application ends)
restart_apps = false          # When stop_with_first_app=false, whether to restart applications until the longest-running app completes for the first time
mirror_output = false
trace_prefix = ""             # Disable trace file prefixes (for trace and response fifos) by default
num_runs = 1                  # Add 1 for warmup, etc
timeout = 360 		      # # The number of seconds to wait for a connection from the frontend before aborting
hang_report = 0               # Seconds without progress (no trace read, no simulated time) before printing every thread's state to stderr; 0 = off

[scheduler]
type = pinned

[scheduler/pinned]
quantum = 1000000         # Scheduler quantum (round-robin for active threads on each core), in nanoseconds
core_mask = 1             # Mask of cores on which threads can be scheduled (default: 1, all cores)
interleaving = 1          # Interleaving of round-robin initial assignment (e.g. 2 => 0,2,4,6,1,3,5,7)

[scheduler/roaming]
quantum = 1000000         # Scheduler quantum (round-robin for active threads on each core), in nanoseconds
core_mask = 1             # Mask of cores on which threads can be scheduled (default: 1, all cores)

[scheduler/static]
core_mask = 1             # Mask of cores on which threads can be scheduled (default: 1, all cores)

[scheduler/big_small]
quantum = 1000000         # Scheduler quantum, in nanoseconds
debug = false

[hooks]
numscripts = 0

[fault_injection]
type = none
injector = none

[routine_tracer]
type = none

[instruction_tracer]
type = none

[sampling]
enabled = false
