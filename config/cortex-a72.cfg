[general]
arch = armv8
enable_icache_modeling = true
mode = 64
syntax = default
#total_cores = 2

[perf_model/core]
core_model = cortex-a72
frequency = 2
type = rob
logical_cpus = 1 # Number of SMT threads per core

[perf_model/core/rob_timer]   # http://www.tomshardware.co.uk/arm-cortex-a72-architecture,review-33404.html#p1
address_disambiguation = true  # Allow loads to bypass preceding stores with an unknown address
commit_width = 3                        # Commit bandwidth (instructions per cycle), per SMT thread: the A72 retires up to 3
in_order = false
issue_contention = true
issue_memops_at_issue = true  # Issue memops to the memory hierarchy at issue time (false = before dispatch)
mlp_histogram = false
outstanding_loads = 48
outstanding_stores = 32
rs_entries = 40          # five 8-entry issue queues
simultaneous_issue = true
store_to_load_forwarding = true

[perf_model/core/interval_timer]
dispatch_width = 3       # 3-wide decode and dispatch (5 issue ports)
window_size = 128

[perf_model/core/static_instruction_costs]
add = 1
sub = 1
mul = 3
div = 12  # 4-12 Word, 4-20 64-bit
fadd = 4
fsub = 4
fmul = 4
fdiv = 11  # 6-11 s form, 6-18 d form
generic = 1 
jmp = 1
string = 1
branch = 1
dynamic_misc = 1
recv = 1
sync = 0
spawn = 0
tlb_miss = 0
mem_access = 0
delay = 0
unknown = 0

[perf_model/branch_predictor]  # http://www.anandtech.com/show/9184/arm-reveals-cortex-a72-architecture-details
type = tage                 # a stand-in for the A72's own two-level predictor
mispredict_penalty = 15

[perf_model/cache]
levels = 2

# Translation: the TLBs the MMU builds (Cortex-A72).  These live under
# perf_model/mmu/tlb_level_*; the perf_model/itlb|dtlb|stlb keys this file used
# to carry were read by nothing, so every core got base.cfg's Intel TLBs.
# A72 TRM: 48-entry instruction and 32-entry data L1 TLBs, fully associative, a 1024-entry 4-way L2 TLB, one walker.
[perf_model/mmu]
page_table_walkers = 1

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 2

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 32
assoc = 32  # fully associative
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Instruction"
size = 48
assoc = 48  # fully associative
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 1024
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 3
replacement_policy = "lru"

[perf_model/l1_icache]
cache_block_size = 64
cache_size = 48 # in KB
associativity = 3
replacement_policy = lru
writethrough = 0
perfect = false
passthrough = false
coherent = true
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
next_level_read_bandwidth = 0 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite
prefetcher = none
address_hash = mask

[perf_model/l1_dcache]
cache_block_size = 64
cache_size = 32 # in KB
associativity = 2
replacement_policy = lru
prefetcher = none  #simple  #??
writethrough = 0
perfect = false
passthrough = false
address_hash = mask
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
outstanding_misses = 6   # MSHRs: "up to six 64-byte cache line requests can be outstanding at a time" (Arm Cortex-A72 MPCore TRM, 100095_0003_06, r0p3, section 6.4 L1 data memory system)
next_level_read_bandwidth = 0 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite

[perf_model/l2_cache]
outstanding_misses = 27   # MSHRs: the L2's read issuing capability, 19, 23 or 27 outstanding reads for a
                          # 20-, 24- or 28-entry fill/eviction queue, an implementation option (Arm Cortex-A72
                          # MPCore TRM, 100095_0003_06, r0p3, Table 7-4 in section 7.7.1); the 28-entry option here
cache_block_size = 64 # in bytes
cache_size = 1024 # in KB
associativity = 16
replacement_policy = lru
data_access_time = 8 # Maximum from the overall RAM latency calculation table, tech ref manual
tags_access_time = 5 # Maximum from the overall RAM latency calculation table, tech ref manual
writeback_time = 2 # approx of 1.5 ns; 3 cycles at 2 GHz; Extra time required to write back data to a higher cache level
prefetcher = none # optional
next_level_read_bandwidth = 0 # bits/cycle from DRAM, 0 = unlimited: the DRAM model limits it (this was 1, a comment copied from the writeback line, which charged 512 cycles of port occupancy per L2 miss)
writethrough = 0
perfect = false
passthrough = false
address_hash = mask
dvfs_domain = core    # Clock domain: core or global
shared_cores = 4      # a cluster: the A72 cluster shares its L2 among up to four cores (TRM: 512 KB to 4 MB, one per cluster); a run of fewer cores has it to itself
perf_model_type = parallel

[caching_protocol]
type = parametric_dram_directory_msi
variant = mesi # msi, mesi or mesif

[perf_model/dram_directory]
total_entries = 65536 # four times the L2's 16384 lines: equal to them, every miss evicted a directory entry and flushed the line (see riscv.cfg)
locations = llc       # one directory slice at each L2, sized above it (total_entries is per slice); at the one memory controller, a single slice served every core and overflowed past four
associativity = 16
directory_type = full_map # Supported (full_map, limited_no_broadcast, limitless)

[perf_model/dram]
type = constant # DRAM performance model type: "constant" or a "normal" distribution
latency = 100 # In nanoseconds
per_controller_bandwidth = 7 # In GB/s
num_controllers = 1 # one memory controller for the system (with -1 and interleaving 0 every core got its own, and the bandwidth grew with the core count)
controllers_interleaving = 0
chips_per_dimm = 8
dimms_per_controller = 4

[perf_model/sync]
reschedule_cost = 0 # In nanoseconds

[dvfs]
type = simple
transition_latency = 0 # In nanoseconds

# Address translation: base.cfg's 4-level radix table over a 48-bit space is
# also AArch64's with a 4 KiB granule (four levels of 512 entries, 4 KiB pages
# and 2 MiB blocks), so it stands as it is; the TLBs are set above.

[perf_model/core/arm]
# SVE vector length in bytes: the size of one SVE load or store to the
# memory hierarchy.  The Cortex-A72 has no SVE; QEMU's -cpu max gives the guest
# every extension, and record-trace sets the guest's vector length to this
# (sve-default-vector-length) so that glibc's SVE memcpy/strlen move what
# the model times.  128 bits, the Neon width.
sve_bytes = 16

[perf_model/baseline_allocator]
# MimicOS's physical memory: an edge system's 4 GiB with a 512 MiB kernel
# reservation, not base.cfg's server-sized 128 GiB and 32 GiB (which also
# made the buddy allocator's set-up take seconds of every run).  Sizes in MB.
memory_size = 4096
kernel_size = 512

[power]
# McPAT (run-sniper --power).  These cores ship in 16 to 28 nm processes; 22 nm
# is the smallest node McPAT 1.0 models (base.cfg's 45 nm is a Nehalem's).
technology_node = 22 # nm
