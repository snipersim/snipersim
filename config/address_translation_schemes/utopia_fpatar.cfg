# Utopia with the fingerprint-array + tag-array RestSeg walk
# ============================================================
# utopia_stress.cfg (utopia.cfg with the TLBs shrunk so that the MMU is asked
# again) with the radix way-table lookup off: the RestSeg walk reads each
# core's fingerprint array (FPA) and, where a fingerprint matches, its tag
# array (TAR), through the per-core fpacache and tarcache and the cache
# hierarchy on a miss.  The UTLB stays on.

#include ./address_translation_schemes/utopia_stress.cfg

[perf_model/utopia]
radix_lookup_enabled = false

[perf_model/utopia/mmu]
disable_fp_tar_caches = false
disable_fp_cache = false
disable_tar_cache = false
