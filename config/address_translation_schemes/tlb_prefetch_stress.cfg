# TLB-prefetch stress
# ===================
# Baseline with the TLB shrunk hard, so that address translation misses often
# enough for the TLB prefetcher to do something.
#
# The default geometry is far too comfortable for a smoke workload: 91 TLB
# misses in 1.9M instructions, at which point every prefetch counter reads zero
# and a change to the prefetch path is unobservable.  16-entry L1 and 64-entry
# L2 TLBs put real pressure on it.
#
# This exists to exercise the MMU's prefetch path, which is otherwise dead code
# in every configuration here.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_base.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 64
assoc = 4

# Turn TLB prefetching on.  mmu_base.cfg sets prefetch_enabled = false, so the
# prefetcher is never constructed and the whole MMU prefetch path is dead in
# every configuration that ships here.
[perf_model/mmu/tlb_subsystem]
prefetch_enabled = true

# The prefetch queue, at the path the code actually reads.  mmu_base.cfg
# declares its PQ under [perf_model/tlb_prefetch/pq1], without the mmu/
# component that tlb_subsystem.cc prepends -- so those keys are unreachable and
# enabling the prefetcher against them would fail to find its configuration.
[perf_model/mmu/tlb_prefetch]
level = 2
number_of_pqs = 1

[perf_model/mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
assoc = 4
access_latency = 1
page_size = 2
page_size_list = 12,21
number_of_prefetchers = 1
prefetcher_list = "asp"

[perf_model/mmu/tlb_prefetch/pq1/asp_prefetcher]
table_size = 16
prefetch_threshold = 0
extra_prefetch = "true"
lookahead = 4
degree = 3
