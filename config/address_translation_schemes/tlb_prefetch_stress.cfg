# TLB-prefetch stress
# ===================
# Baseline with the TLB shrunk hard, so that address translation misses often
# enough for the TLB prefetcher to do something.
#
# The default geometry is far too comfortable for a smoke workload: 91 TLB
# misses in 1.9M instructions, at which point every prefetch counter reads zero
# and a change to the prefetch path is unobservable.  16-entry L1 and 64-entry
# L2 TLBs put real pressure on it.
#
# This exists to exercise the MMU's prefetch path, which is otherwise dead code
# in every configuration here.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_base.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 64
assoc = 4
