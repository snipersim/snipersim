# NUMA Revelator stress
# =====================
# numa_revelator with the TLBs shrunk hard, for the same reason
# tlb_prefetch_stress.cfg exists.
#
# The speculative MMU only invokes the engine's data-side prediction on a
# page walk that does not fault, and at the default TLB geometry a smoke
# workload never walks a page twice: its 91 translations are all first
# touches, so every walk faults and only the page-table-side speculation
# runs.  The engine's hint table and saturating counters are trained on the
# data side (VPN granularity) and are only consulted there, so under the
# default geometry their hit and confidence counters read zero whatever the
# engine does.
#
# The shrunk TLBs make the workload re-walk pages it has already touched, so
# the walks resolve without faulting, the data-side predictions are issued,
# the hints get looked up and found, and the counters reach confidence.
#
# Every engine and allocator knob still comes from numa_revelator.cfg; this
# scheme changes TLB geometry and nothing else.

#include ./address_translation_schemes/numa_revelator.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 64
assoc = 4
