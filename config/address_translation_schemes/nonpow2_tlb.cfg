# Non-power-of-two TLB geometry
# =============================
# Baseline with a 1536-entry, 8-way L2 TLB: 192 sets, which is not a power of
# two.  Real TLB geometries often are not (48, 96, 1280, 3072 entries), and the
# set-index hashes have to cope.
#
# This exists to exercise that path.  Every other configuration in the tree uses
# a power-of-two set count, where HASH_MASK's & (n-1) and HASH_MOD's % n are the
# same expression, so the difference between them is invisible.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_base.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

[perf_model/mmu/tlb_level_2/tlb1]
size = 1536
assoc = 8
