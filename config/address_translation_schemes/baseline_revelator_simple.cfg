# Baseline + revelator_simple allocator
# =====================================
# baseline.cfg with the revelator_simple allocator in place of reserve_thp:
# hashed 4KB data frames and hashed leaf page-table frames, no reservation
# machinery, no speculative engine.  A comparison against baseline isolates
# the placement; revelator_open.cfg is where the engine that predicts it
# sits on top.
#
# The Revelator exception handler is selected so that the leaf page-table
# frame goes through the allocator's hashed path (allocate with
# is_pagetable_allocation) rather than the generic bump allocator -- that
# path, and the counters it moves, are what this allocator adds.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration
#include ./mmu_configs/mmu_base.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration
#include ./dram_configs/ddr4_2400.cfg

# Physical memory allocator
#include ./physical_memory_allocators/revelator_simple_alloc.cfg

[general]
exception_handler_type = "revelator"
