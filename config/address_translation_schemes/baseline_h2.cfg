# Baseline + H2 TLB prefetcher
# ============================
# Standard 4-level radix page table with 4KB pages, ReserveTHP allocator, and
# the H2 TLB prefetcher: once three demand pages are known, every access to
# the prefetch queue's TLB walks for the demand page plus each of the two
# most recent strides.
#
# See config/mmu_configs/mmu_h2.cfg.

