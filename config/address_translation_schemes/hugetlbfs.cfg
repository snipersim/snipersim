# HugeTLBfs Configuration
# =======================
# The baseline machine with the sniper-space HugeTLBfs service backing the
# application's large VMAs with 2 MB pages from a pre-reserved pool.
#
# On Linux a region is hugetlbfs-backed because the application asked --
# mmap(MAP_HUGETLB) or a file on a hugetlbfs mount -- and a SIFT trace does
# not record that request: the recorder's VMA log (record-trace --vma) is the
# address ranges of /proc/self/maps and nothing more.  So which VMAs the pool
# backs is decided here, by criterion: every VMA of at least min_vma_mb MB,
# plus any explicit backed_ranges.  Within a backed VMA each 2 MB-aligned
# block that lies wholly inside it takes one 2 MB frame from the pool on its
# first fault (one level-2 PTE, one 2 MB TLB entry); the blocks at the VMA's
# unaligned edges, and every block once the pool is empty, fall back to the
# allocator's base pages.  The pool's frames come from the kernel-reserved
# region of physical memory, so they never alias the allocator's.
#
# A simulation needs the trace's VMAs for the pool to back anything: run
# with --traces=<trace>.sift next to the recorder's <trace>.vma.  Without
# them the service initialises and stays inert, as under the baseline.
#
# The allocator's own THP promotion is turned off (threshold_for_promotion
# = 1.0: a region is promoted when its utilisation exceeds the threshold,
# which a fraction cannot), so that every 2 MB mapping in this configuration
# is one the pool handed out -- what makes the page table's 2 MB discoveries
# and the 2 MB DTLB's hits attributable to it.

#include ./address_translation_schemes/baseline.cfg

[perf_model/hugetlbfs]
enabled = true
nr_hugepages_2mb = 2      # a pool small enough to run dry, so the fallback runs too
nr_hugepages_1gb = 0
overcommit = false
min_vma_mb = 4            # the feature check's guest maps 8 MB; the shared workload nothing this large
backed_ranges = ""        # "start-end,start-end" in hex, if a VMA is to be named outright

[perf_model/reserve_thp]
threshold_for_promotion = 1.0
