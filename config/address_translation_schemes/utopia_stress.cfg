# Utopia, stress geometry
# ========================
# utopia.cfg with the TLBs shrunk to a few entries, for the reason
# spec_oracle_stress.cfg exists: at the default geometry the half-dozen 2MB
# RestSeg pages of a small workload fit in the L1 TLB after their faults and
# the MMU is never asked again.  Here translations miss the TLBs, so the UTLB
# and the RestSeg walk answer them (data_in_utlb, data_in_restseg_no_fault).

#include ./address_translation_schemes/utopia.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 4
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 4
assoc = 4

[perf_model/utopia/utlb]
entries = 1
assoc = 1
