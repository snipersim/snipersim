# NUMA Revelator Configuration
# ============================
# NUMA-aware Revelator: the hash-based allocator places frames within the
# NUMA node the placement policy picks, and the speculative engine predicts
# the frame per candidate node (PTW-trained counters, NUMA hint table).

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration (speculative)
#include ./mmu_configs/mmu_spec.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration, then the NUMA topology on top of it
#include ./dram_configs/ddr4_2400.cfg
#include ./numa.cfg

# Physical memory allocator
#include ./physical_memory_allocators/numa_revelator_alloc.cfg
#include ./physical_memory_allocators/swap_space.cfg

# Speculative engine
#include ./spec_engine_configs/spec_engine_numa_revelator.cfg

# ---- Scheme-specific overrides ----

# The DRAM controller's node ranges follow the allocator's frame layout.
# The allocator (numa_revelator_alloc.cfg: 65536 MB per node, 16384 MB of it
# kernel) keeps both nodes' kernel reservations as one 32 GB prefix and then
# lays out each node's 48 GB of usable frames contiguously; the controller
# maps nodes to consecutive physical ranges by capacity, so node 0 spans the
# prefix plus its usable frames (80 GB) and node 1 the remaining 48 GB.
[perf_model/dram/numa/node0]
capacity_gb = 80
kernel_reserved_gb = 32

[perf_model/dram/numa/node1]
capacity_gb = 48
kernel_reserved_gb = 0
