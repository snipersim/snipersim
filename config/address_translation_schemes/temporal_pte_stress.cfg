# TRAIL (temporal PTE prefetcher) stress
# =====================================
# baseline_temporal_pte with the TLBs shrunk hard, for the same reason
# tlb_prefetch_stress.cfg exists.
#
# TRAIL is confidence-gated: it only issues a prediction once it has seen the
# same VPN delta repeat.  The default geometry gives a smoke workload about 20
# demand accesses at the prefetcher, which is not enough repetition for any
# entry to reach confidence -- so whether it predicts at all comes down to the
# exact guest address layout, and the layout moves with the size of the
# environment block.  Under the regression's whitelisted environment every
# candidate is skipped as zero-delta or low-confidence and every prefetch
# counter reads zero, which makes the shipped baseline useless as an
# activation check.
#
# The shrunk TLBs raise the demand-access count enough for deltas to repeat,
# so learning turns into predictions and predictions into prefetches
# regardless of where the workload happens to land.
#
# Every prefetcher knob still comes from mmu_temporal_pte.cfg; this scheme
# changes TLB geometry and nothing else.

#include ./address_translation_schemes/baseline_temporal_pte.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 64
assoc = 4
