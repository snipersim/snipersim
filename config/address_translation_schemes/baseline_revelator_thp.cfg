# Baseline + revelator_thp allocator
# ==================================
# baseline.cfg with the revelator_thp allocator in place of reserve_thp:
# hashed 2MB regions first, then THP reservations, then hashed 4KB frames,
# and hashed leaf page-table frames; no speculative engine (the allocator's
# engine feedback finds none and does nothing).  revelator_thp.cfg is where
# the engine that predicts this placement sits on top.
#
# The Revelator exception handler is selected so that the leaf page-table
# frame goes through the allocator's hashed path (allocate with
# is_pagetable_allocation) rather than the generic bump allocator.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration
#include ./mmu_configs/mmu_base.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration
#include ./dram_configs/ddr4_2400.cfg

# Physical memory allocator
#include ./physical_memory_allocators/revelator_thp_alloc.cfg

[general]
exception_handler_type = "revelator"
