# Hardware page-fault handling
# ============================
# Baseline, with the MMU that handles page faults in hardware rather than
# handing every one of them to the OS.
#
# Written here rather than ported: Virtuoso ships mmu_configs/mmu_hwfault.cfg
# but no scheme that selects it, so there was nothing to run.  This is
# baseline.cfg with the MMU swapped, so a comparison against baseline isolates
# the fault-handling change.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration: hardware fault handling
#include ./mmu_configs/mmu_hwfault.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration
#include ./dram_configs/ddr4_2400.cfg

# Physical memory allocator
#include ./physical_memory_allocators/reserve_thp.cfg
