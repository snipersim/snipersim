# Per-thread ROI barrier
# ======================
# baseline with magic-instruction ROI selected, so SimRoiExpect /
# SimThreadRoiStart actually decide when the performance models turn on.
#
# Without general/magic the simulator runs the whole application in ROI
# (Config::ROI_FULL) and the barrier gates nothing -- every magic ROI
# command is accepted and ignored.  A check written against the default
# would therefore pass whether or not the barrier worked.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_base.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

[general]
magic = true
