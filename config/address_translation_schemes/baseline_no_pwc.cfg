# Baseline without page walk caches
# =================================
# baseline.cfg with the page-table-walk filter set to "default", which
# passes every walk through untouched: no page walk caches are built, no
# upper-level access is ever filtered out, and every walk pays for all of
# its levels.  The "pwc" filter that 4_level_radix.cfg selects is what every
# other scheme runs under; this is the control for it.

#include ./address_translation_schemes/baseline.cfg

[perf_model/mmu]
ptw_filter_type = "default"
