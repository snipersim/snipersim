# Baseline + page-size prediction
# ===============================
# baseline.cfg with the L2 TLB's page-size predictor switched on.  The L2
# TLB holds 4KB and 2MB translations in separate banks; with prediction on,
# the MMU asks the predictor which bank to look in before the L2 lookup and
# charges correct_prediction_latency on a correct guess and
# misprediction_latency on a wrong one, instead of the TLB's flat latency.
#
# The predictor itself ("default", a history-indexed table of 4KB/2MB bits,
# translation_components/page_size_prediction) is already named by
# mmu_base.cfg; this is the only switch that makes the MMU consult it.

#include ./address_translation_schemes/baseline.cfg

[perf_model/mmu]
page_size_prediction_enabled = true
