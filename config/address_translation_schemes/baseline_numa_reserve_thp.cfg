# Baseline + NUMA reserve_thp allocator
# =====================================
# baseline.cfg with the NUMA-aware reservation-based THP allocator on a
# two-node tiered DRAM controller: each node has its own buddy and 2MB map,
# a fault reserves on the faulting core's node, and page-table frames come
# from that node's kernel region.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration
#include ./mmu_configs/mmu_base.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration, then the NUMA topology on top of it
#include ./dram_configs/ddr4_2400.cfg
#include ./numa.cfg

# Physical memory allocator
#include ./physical_memory_allocators/numa_reserve_thp.cfg

# ---- Scheme-specific overrides ----

# The DRAM controller's node ranges follow the allocator's frame layout.
# The allocator (numa_reserve_thp.cfg: 65536 MB per node, 16384 MB of it
# kernel) lays the nodes out back to back from frame 0 with no global
# kernel prefix, each node's kernel reservation at its own start; the
# controller maps nodes to consecutive physical ranges by capacity, so
# node 0 is the first 64 GB and node 1 the next 64 GB.
[perf_model/dram/numa/node0]
capacity_gb = 64
kernel_reserved_gb = 16

[perf_model/dram/numa/node1]
capacity_gb = 64
kernel_reserved_gb = 16
