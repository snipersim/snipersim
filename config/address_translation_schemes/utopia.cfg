# Utopia Configuration
# =====================
# Full Utopia address translation scheme with:
#   - 4-level allocation hierarchy: RestSeg-2MB → FlexSeg-THP → RestSeg-4KB → FlexSeg-4KB
#   - Range-based translation for RestSeg (no page table walks)
#   - Conventional page tables for FlexSeg
#   - Utopia-aware exception handler (skips PT updates for RestSeg)
#
# Architecture Overview:
#   ┌─────────────────────────────────────────────────────────────────┐
#   │                     UTOPIA MEMORY SYSTEM                        │
#   ├─────────────────────────────────────────────────────────────────┤
#   │                                                                 │
#   │   ┌─────────────┐     ┌─────────────┐     ┌─────────────┐      │
#   │   │  RestSeg-0  │     │  RestSeg-1  │     │   FlexSeg   │      │
#   │   │   (2MB)     │     │   (4KB)     │     │  (THP+4KB)  │      │
#   │   │             │     │             │     │             │      │
#   │   │ Range-based │     │ Range-based │     │ Page Tables │      │
#   │   │ Translation │     │ Translation │     │  Required   │      │
#   │   └─────────────┘     └─────────────┘     └─────────────┘      │
#   │                                                                 │
#   │   Allocation Priority: L1(2MB) → L2(THP) → L3(4KB) → L4(4KB)   │
#   │                        RestSeg    FlexSeg   RestSeg   FlexSeg  │
#   └─────────────────────────────────────────────────────────────────┘

