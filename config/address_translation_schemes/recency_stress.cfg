# Recency stress
# ==============
# baseline_recency with the TLBs shrunk hard.  Unlike the other
# prefetchers this is not merely about raising the miss count: Recency
# builds its list out of TLB *victims*, so with the default geometry --
# which never evicts anything over a smoke workload -- the list stays
# empty and it can never prefetch, no matter how many misses it sees.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_recency.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 64
assoc = 4
