# ATP stress
# ==========
# baseline_atp with the TLBs shrunk hard.  ATP gates real prefetching on an
# 8-bit saturating enable counter, and over a smoke workload at the default
# geometry that counter just oscillates -- 58 increments against 54
# decrements across 112 queries -- so it never crosses the threshold and
# every query records atp_choice_disable.  More misses let the counter
# settle and the child prefetchers actually get chosen.

#include ./address_translation_schemes/baseline_atp.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 64
assoc = 4
