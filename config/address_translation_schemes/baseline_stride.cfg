# Baseline + stride TLB prefetcher
# ================================
# Standard 4-level radix page table with 4KB pages, ReserveTHP allocator, and
# the fixed-window stride TLB prefetcher: on every access to the prefetch
# queue's TLB it walks the page table for the +/-length neighbours of the
# demand page.
#
# See config/mmu_configs/mmu_stride.cfg for the prefetcher knobs.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_stride.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400.cfg
#include ./physical_memory_allocators/reserve_thp.cfg
