# Revelator THP stress
# ====================
# revelator_thp with the TLBs shrunk hard, for the same reason
# numa_revelator_stress.cfg exists: the speculative MMU only runs the
# engine's data-side prediction on a page walk that does not fault, and at
# the default TLB geometry a smoke workload never walks a page twice, so
# only the page-table-side speculation runs.
#
# This allocator hands every data fault a whole hashed 2MB region, so the
# smoke workload's data sits in six 2MB pages -- and six entries fit in any
# TLB the other stress schemes shrink to.  The 2MB L1 TLB and the L2 TLB
# are therefore cut below that, so the workload re-walks pages it has
# already touched, the data-side predictions are issued and can be scored
# against the region the allocator actually chose.
#
# Every engine and allocator knob still comes from revelator_thp.cfg; this
# scheme changes TLB geometry and nothing else.

#include ./address_translation_schemes/revelator_thp.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 4
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 4
assoc = 4
