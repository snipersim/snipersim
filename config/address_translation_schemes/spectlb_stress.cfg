# SpecTLB stress
# ==============
# spectlb_reservethp with two things changed so that the engine has
# something to speculate on:
#
# The allocator's memory is left unfragmented and its promotion threshold
# is raised to 1.0.  reserve_thp.cfg ships target_fragmentation = 0.0 --
# the whole of memory fragmented, no 2MB region reservable -- so under
# spectlb_reservethp every fault falls back to a 4KB buddy page,
# reserve_thp.two_mb_reserved stays 0 and SpecTLB, which only installs a
# page's 2MB region when the allocator reports it reserved, installs
# nothing.  With reservable memory every data fault lands in a reserved
# region, and with the threshold at 1.0 (promotion needs utilisation above
# it, which a fraction cannot reach) the pages stay 4KB inside their
# reservations: the SpecTLB case, a 4KB page whose physical frame sits at
# its offset in a reserved 2MB region.
#
# The TLBs are shrunk, for the reason spec_oracle_stress.cfg exists:
# SpecTLB is looked up on a TLB miss and installs a region after the
# miss's walk, so it only pays off when a region is walked again, and at
# the default geometry a smoke workload never walks a page twice.
#
# Every other engine and allocator knob comes from spectlb_reservethp.cfg.

#include ./address_translation_schemes/spectlb_reservethp.cfg

[perf_model/reserve_thp]
target_fragmentation = 1.0
threshold_for_promotion = 1.0

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 4
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 4
assoc = 4
