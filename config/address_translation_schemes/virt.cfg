# Virtualised Execution Configuration
# ===================================
# A guest MMU nested on a host MMU: guest virtual -> guest physical through the
# guest OS's radix page table, guest physical -> host physical through the host
# OS's, with every guest page-table access itself translated by the host MMU
# (a two-dimensional walk).  Everything else is the baseline machine.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration (guest MMU nested on the host MMU)
#include ./mmu_configs/mmu_virt.cfg

# Page table configuration (host and guest radix page tables)
#include ./pagetable_configs/4_level_radix_virt.cfg

# DRAM configuration
#include ./dram_configs/ddr4_2400.cfg

# Physical memory allocators (host and guest)
#include ./physical_memory_allocators/baseline_allocator_virt.cfg

# ---- Scheme-specific overrides ----

[general]
native_environment = "false"      # not a bare machine: the application runs in a VM
virtualized_environment = "true"  # creates the guest OS (mimicos_guest) next to the host one

[perf_model/mimicos_guest]
enabled = "false"
page_fault_latency = 0
