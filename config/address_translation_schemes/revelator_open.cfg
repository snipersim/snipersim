# Revelator (open addressing) Configuration
# =========================================
# The open-addressing Revelator engine on the revelator_simple allocator.
# The allocator places every 4KB data frame at CityHash(VPN) over the user
# frames, which is exactly the engine's probe 0; the engine then also
# predicts the next frame (probe 1), which is where open addressing would
# have put a page whose home frame was taken.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration (speculative)
#include ./mmu_configs/mmu_spec.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration
#include ./dram_configs/ddr4_2400.cfg

# Physical memory allocator
#include ./physical_memory_allocators/revelator_simple_alloc.cfg

# Speculative engine
#include ./spec_engine_configs/spec_engine_revelator_open.cfg

# ---- Scheme-specific overrides ----

# The Revelator exception handler places the leaf page-table frame through
# the allocator's hashed path (allocate with is_pagetable_allocation), as
# revelator.cfg does; the default handler bump-allocates it.
[general]
exception_handler_type = "revelator"
