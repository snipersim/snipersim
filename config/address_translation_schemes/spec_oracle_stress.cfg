# Oracle spec engine stress
# =========================
# spec_oracle_reservethp with the TLBs shrunk hard, for the reason
# revelator_thp_stress.cfg exists: the speculative MMU runs an engine's
# data-side prediction only on a page walk that does not fault, and at the
# default TLB geometry a smoke workload never walks a page twice -- under
# reserve_thp every data fault gets a whole 2MB page, six of which fit in
# any TLB.  The 2MB L1 TLB and the L2 TLB are cut below that, so the
# workload re-walks pages it has already touched and the oracle is invoked.
#
# Every engine and allocator knob still comes from spec_oracle_reservethp.cfg;
# this scheme changes TLB geometry and nothing else.

#include ./address_translation_schemes/spec_oracle_reservethp.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 4
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 4
assoc = 4
