# Revelator (open addressing) stress
# ==================================
# revelator_open with the TLBs shrunk hard, for the same reason
# numa_revelator_stress.cfg exists: the speculative MMU only runs the
# engine's data-side prediction on a page walk that does not fault, and at
# the default TLB geometry a smoke workload never walks a page twice -- its
# translations are all first touches, every walk faults, and only the
# page-table-side speculation runs.  The shrunk TLBs make it re-walk pages
# it has already touched, so the data-side predictions are issued and can
# be scored against the frame the allocator actually chose.
#
# Every engine and allocator knob still comes from revelator_open.cfg; this
# scheme changes TLB geometry and nothing else.

#include ./address_translation_schemes/revelator_open.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 64
assoc = 4
