# POM-TLB stress
# ==============
# reservethp_pomtlb with the hardware TLBs shrunk hard, for the reason
# spec_oracle_stress.cfg exists: under reserve_thp every data fault gets a
# whole 2MB page, six of which fit in any TLB, so at the default geometry a
# smoke workload never misses the hardware TLBs on a page it has already
# touched and the POM-TLB is consulted only on first-touch faults, which it
# cannot hold yet.  The 2MB L1 TLB and the L2 TLB are cut below that, so
# the workload re-references pages beyond the hardware TLBs' reach and the
# POM-TLB answers them.
#
# Every POM-TLB and allocator knob still comes from reservethp_pomtlb.cfg;
# this scheme changes the hardware TLB geometry and nothing else.

#include ./address_translation_schemes/reservethp_pomtlb.cfg

[perf_model/mmu/tlb_level_1/tlb1]
size = 16
assoc = 4

[perf_model/mmu/tlb_level_1/tlb2]
size = 4
assoc = 4

[perf_model/mmu/tlb_level_2/tlb1]
size = 4
assoc = 4
