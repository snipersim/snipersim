# Linux OS daemon models
# ======================
# Baseline, with kcompactd, khugepaged and kswapd enabled.
#
# Written here rather than ported: Virtuoso enables the daemons per experiment
# rather than shipping a scheme for them, so there was nothing to run.  This is
# baseline.cfg plus the daemon settings, so a comparison against baseline
# isolates their effect.
#
# The scan intervals are deliberately short.  The daemons run from HOOK_PERIODIC
# at a simulated interval whose default is 10ms, and a smoke workload finishes
# in well under one -- at which point the daemons are configured, register their
# counters, and never actually scan.  50us makes them run during a short run.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration
#include ./mmu_configs/mmu_base.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration
#include ./dram_configs/ddr4_2400.cfg

# Physical memory allocator: the daemons work on the reservation allocator's
# 2MB map, so this scheme requires it.
#include ./physical_memory_allocators/reserve_thp.cfg

[perf_model/mimicos_host]
kcompactd_enabled = true
kcompactd_scan_interval_us = 50
kcompactd_max_pages_per_scan = 64

khugepaged_enabled = true
khugepaged_scan_interval_us = 50
khugepaged_max_promotions_per_scan = 8

kswapd_enabled = true
kswapd_scan_interval_us = 50
kswapd_batch_size = 32
