[general]
arch = riscv
enable_icache_modeling = true
mode = 64
syntax = default
#total_cores = 2

[perf_model/core]
core_model = riscv
frequency = 2
type = rob # or interval
logical_cpus = 1 # Number of SMT threads per core

# The core: BOOM v3's MegaBoomConfig (riscv-boom src/main/scala/common/config-mixins.scala):
# 4-wide decode, 128-entry ROB, 32-entry load and store queues, issue queues of
# 24 (mem) + 40 (int) + 32 (fp) entries, 32 KiB 8-way L1 caches with 8 MSHRs,
# TAGE-L branch prediction.  The L2 is a 1 MiB inclusive L2 shared by a cluster
# of up to four cores (Chipyard sizes its InclusiveCache per SoC; the hit time
# is an estimate), the DRAM one DDR4-3200 channel.  The L1 MSHRs are
# l1_dcache/outstanding_misses, for either core model.
# Until 9.0 this file held the Cortex-A72's core parameters under a RISC-V name.
[perf_model/core/rob_timer]
address_disambiguation = true  # Allow loads to bypass preceding stores with an unknown address
commit_width = 4                        # Commit bandwidth (instructions per cycle), per SMT thread: the decode width
in_order = false
issue_contention = true
issue_memops_at_issue = true  # Issue memops to the memory hierarchy at issue time (false = before dispatch)
mlp_histogram = false
outstanding_loads = 32   # LDQ
outstanding_stores = 32  # STQ
rob_repartition = true
rs_entries = 96          # the three issue queues: 24 mem + 40 int + 32 fp
simultaneous_issue = true
store_to_load_forwarding = true

[perf_model/core/interval_timer]
dispatch_width = 4
window_size = 128

[perf_model/core/static_instruction_costs]
add = 1
sub = 1
mul = 3
div = 12  # 4-12 Word, 4-20 64-bit
fadd = 4
fsub = 4
fmul = 4
fdiv = 11  # 6-11 s form, 6-18 d form
generic = 1 
jmp = 1
string = 1
branch = 1
dynamic_misc = 1
recv = 1
sync = 0
spawn = 0
tlb_miss = 0
mem_access = 0
delay = 0
unknown = 0

[perf_model/branch_predictor] 
type = tage                 # BOOM v3: TAGE-L
mispredict_penalty = 8      # the front end's redirect (F0-F4, decode, rename)

#https://github.com/ucb-bar/riscv-boom/blob/master/src/main/scala/common/configs.scala
[perf_model/cache]
levels = 2

# Translation: the TLBs the MMU builds (a large out-of-order RISC-V core).  These live under
# perf_model/mmu/tlb_level_*; the perf_model/itlb|dtlb|stlb keys this file used
# to carry were read by nothing, so every core got base.cfg's Intel TLBs.
# Approximation for an out-of-order RISC-V core of this width: 32-entry fully associative L1 TLBs, a 512-entry 4-way L2 TLB, one walker; the instruction-side sizes are a guess.
[perf_model/mmu]
page_table_walkers = 1

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 2

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 32
assoc = 32  # fully associative
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Instruction"
size = 32
assoc = 32  # fully associative
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 512
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 3
replacement_policy = "lru"

[perf_model/l1_icache]
cache_block_size = 64 # in B
cache_size = 32 # in KB
associativity = 8
replacement_policy = lru
writethrough = 0
perfect = false
passthrough = false
coherent = true
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
next_level_read_bandwidth = 0 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite
prefetcher = none
address_hash = mask

[perf_model/l1_dcache]
cache_block_size = 64
cache_size = 32 # in KB
associativity = 8
replacement_policy = lru
prefetcher = none  #simple  #??
writethrough = 0
perfect = false
passthrough = false
address_hash = mask
data_access_time = 3
tags_access_time = 1
perf_model_type = parallel
writeback_time = 0    # Extra time required to write back data to a higher cache level
dvfs_domain = core    # Clock domain: core or global
shared_cores = 1      # Number of cores sharing this cache
outstanding_misses = 8   # MSHRs
next_level_read_bandwidth = 0 # Read bandwidth to next-level cache, in bits/cycle, 0 = infinite

[perf_model/l2_cache]
cache_block_size = 64 # in bytes
cache_size = 1024 # in KB: a 1 MiB L2 (Chipyard's InclusiveCache is sized per SoC; 512 KiB is its default)
associativity = 16
replacement_policy = lru
data_access_time = 8 # Maximum from the overall RAM latency calculation table, tech ref manual
tags_access_time = 5 # Maximum from the overall RAM latency calculation table, tech ref manual
writeback_time = 2 # approx of 1.5 ns; 3 cycles at 2 GHz; Extra time required to write back data to a higher cache level
prefetcher = none # optional
next_level_read_bandwidth = 0 # bits/cycle from DRAM, 0 = unlimited: the DRAM model limits it (this was 1, a comment copied from the writeback line, which charged 512 cycles of port occupancy per L2 miss)
writethrough = 0
perfect = false
passthrough = false
address_hash = mask
dvfs_domain = core    # Clock domain: core or global
shared_cores = 4      # a cluster: Chipyard's InclusiveCache is one L2 shared by the tiles; here by up to four cores; a run of fewer cores has it to itself
outstanding_misses = 0
perf_model_type = parallel

[perf_model/llc]
evict_buffers = 20 # minimum from the manual: "Configurable number of Fill/Eviction Queue (FEQ) entries to 20, 24, or 28."

[caching_protocol]
type = parametric_dram_directory_msi
variant = mesi # msi, mesi or mesif

[perf_model/dram_directory]
total_entries = 65536 # must exceed what the private caches hold (the 1 MB L2 is 16,384 lines): a directory the size of the L2 evicts every line the L2 fills, with a flush round trip on each miss
locations = llc       # one directory slice at each L2, sized above it (total_entries is per slice); at the one memory controller, a single slice served every core and overflowed past four
associativity = 16
directory_type = full_map # Supported (full_map, limited_no_broadcast, limitless)

[perf_model/dram]
type = constant # DRAM performance model type: "constant" or a "normal" distribution
latency = 100 # In nanoseconds
per_controller_bandwidth = 25.6 # In GB/s: one DDR4-3200 channel (or two LPDDR4X-3200 x32 channels), the edge system the accelerator studies assume (docs/ACCELERATOR_COMPONENTS.md); base.cfg's 5 is a placeholder
num_controllers = 1 # one memory controller for the system (with -1 and interleaving 0 every core got its own, and the bandwidth grew with the core count)
controllers_interleaving = 0
chips_per_dimm = 8
dimms_per_controller = 4

[perf_model/sync]
reschedule_cost = 0 # In nanoseconds

[network/bus]
ignore_local_traffic = true # Do not count traffic between core and directory on the same tile
bandwidth = 25.6 # in GB/s. Actually, it's 12.8 GB/s per direction and per connected chip pair

[dvfs]
type = simple
transition_latency = 0 # In nanoseconds

# The attached matrix tile (common/performance_model/.../ame_tile.cc): where
# AME instructions, and the DMA-attached accelerator's tasks (Xsnacc), execute
# when the unit is not part of the core's pipeline.
# coupling: ica (no tile, AME costed in the core from the generated ame_*
# placeholders below), oca_l1 / oca_l2 / oca_llc (a tile with its own port
# entering the hierarchy at that level), nca (at the LLC, with a transfer
# engine that fetches a square's rows when the instruction is dispatched).
# With this two-level cache configuration oca_llc is oca_l2.
# The vector unit's width (core_model_boom_v1.cc): a vector instruction holds its
# port for the cycles its operand takes through a datapath of datapath_bytes; 0 is
# the whole register group at once, the placeholder behaviour, so the numbers
# measured so far do not move.  The trace carries no vtype, so the group is
# vector_bytes (in [perf_model/core/riscv]) times the LMUL assumed here.
[perf_model/core/vector]
datapath_bytes = 0
lmul = 1

[perf_model/ame_tile]
coupling = ica
dispatch_latency = 4      # cycles from the core's issue to the tile's queue
result_latency = 4        # cycles for an X-register result, or a task's completion, to return
bytes_per_cycle = 64      # the tile's port width
mma_issue_cycles = 0      # squares accepted every this many cycles; 0: N^3 / mma_macs_per_cycle for the N x N squares the tile loads
mma_macs_per_cycle = 0    # the tile's array: 0 means N*N (one square row of products per cycle: 16 for 4x4, 1024 for 32x32)
mma_latency = 8           # pipeline depth of a square product (the result comes after max(issue, this))
other_latency = 1
macs_per_cycle = 16       # the DMA-attached accelerator's compute rate (Xsnacc tasks)

# The instruction classes and their placeholder latencies are generated into one
# fragment that every RISC-V configuration includes.
#include common_configs/riscv_isa_classes.cfg
# Address translation: RISC-V Sv39 (3 levels, 39 bits), not the x86-64 4-level table of base.cfg
#include pagetable_configs/3_level_radix_sv39.cfg

[perf_model/baseline_allocator]
# MimicOS's physical memory: an edge system's 4 GiB with a 512 MiB kernel
# reservation, not base.cfg's server-sized 128 GiB and 32 GiB (which also
# made the buddy allocator's set-up take seconds of every run).  Sizes in MB.
memory_size = 4096
kernel_size = 512
