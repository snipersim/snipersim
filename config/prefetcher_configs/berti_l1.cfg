# Berti data prefetcher at the L1-D
# =================================
# Selects perf_model/l1_dcache/prefetcher = berti (BertiPrefetcher): learns,
# per page, the line delta that would have been timely from the requests
# that preceded each hit, prefetches that delta ahead of every demand, and
# records a page's pattern by page and by trigger IP for its next visit.
# The table sizes are the ChampSim ones.  (The TLB-side Berti is selected in
# the MMU prefetch queue: mmu_configs/mmu_berti.cfg.)
#
# Usage:
#   run-sniper -cgainestown -cprefetcher_configs/berti_l1

[perf_model/l1_dcache]
prefetcher = "berti"

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l2_cache]
prefetcher = "none"
