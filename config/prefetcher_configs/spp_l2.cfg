# SPP, the Signature Path Prefetcher, at the L2
# =============================================
# Selects perf_model/l2_cache/prefetcher = spp (SPPPrefetcher): delta
# signatures per page, a pattern table of the deltas that followed each
# signature, lookahead along the predicted path, a quotient filter against
# duplicates and a global history register for page crossings.  The three
# knobs are the ChampSim spp_dev switches; all default to on.
#
# Usage:
#   run-sniper -cgainestown -cprefetcher_configs/spp_l2

[perf_model/l1_dcache]
prefetcher = "none"

[perf_model/l2_cache]
prefetcher = "spp"

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l2_cache/prefetcher/spp]
lookahead_on = true   # follow the signature path beyond the first delta
filter_on = true      # drop prefetches the filter has already seen
ghr_on = true         # remember deltas that leave the page
