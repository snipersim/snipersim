# IPCP, the Instruction Pointer Classifier Prefetcher, at the L1-D
# ================================================================
# Selects perf_model/l1_dcache/prefetcher = ipcp (IPCPPrefetcher): each
# load IP is classed as a stream, a constant stride or a complex stride
# from its recent line deltas and prefetched accordingly; an IP that fits
# no class gets a next-line prefetch while the miss rate stays under
# spec_nl_threshold misses per thousand accesses.
#
# Usage:
#   run-sniper -cgainestown -cprefetcher_configs/ipcp_l1

[perf_model/l1_dcache]
prefetcher = "ipcp"

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/ipcp]
prefetch_degree = 3     # lines per access (a stream gets twice as many)
spec_nl_threshold = 15  # next-line while misses per 1000 accesses stay below this

[perf_model/l2_cache]
prefetcher = "none"
