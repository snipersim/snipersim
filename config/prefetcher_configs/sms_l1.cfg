# SMS, Spatial Memory Streaming, at the L1-D
# ==========================================
# Selects perf_model/l1_dcache/prefetcher = sms (SMSPrefetcher): the lines
# touched in a spatial region are accumulated while the region is live and
# recorded against the (PC, offset) that first touched it; the next time
# that trigger fires the recorded pattern is replayed as prefetches.  The
# sizes are the ChampSim defaults; region_size is in bytes and must be a
# power of two of at most 4096.
#
# Usage:
#   run-sniper -cgainestown -cprefetcher_configs/sms_l1

[perf_model/l1_dcache]
prefetcher = "sms"

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/sms]
at_size = 32            # accumulation table entries (live regions)
ft_size = 64            # filter table entries (regions seen once)
pht_size = 2048         # pattern history table entries
pht_assoc = 16          # ... and its associativity
pref_degree = 4         # prefetches issued per access
region_size = 2048      # spatial region, in bytes
pref_buffer_size = 256  # prefetches queued between accesses

[perf_model/l2_cache]
prefetcher = "none"
