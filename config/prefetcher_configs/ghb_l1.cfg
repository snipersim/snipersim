# GHB Prefetcher Configuration
# =============================
# Global History Buffer prefetcher at L1D.
# Uses delta correlation to predict future accesses.
# Good for complex but repeating patterns.
#
# Virtuoso ships this with the keys ghb_size / table_size / prefetch_width /
# prefetch_depth, which the GHB prefetcher has never read (there as here it
# reads ghb_size, ghb_table_size, width and depth: ghb_prefetcher.cc), so
# the upstream file cannot load.  Same values, under the keys that are read.

[perf_model/l1_dcache]
prefetcher = "ghb"

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/ghb]
ghb_size = 256
ghb_table_size = 256
width = 4
depth = 2

[perf_model/l2_cache]
prefetcher = "none"
