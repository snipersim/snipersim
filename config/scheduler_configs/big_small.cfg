# Big/small scheduler on a heterogeneous quad-core
# ================================================
# Selects scheduler/type = big_small (SchedulerBigSmall): the cores tagged big
# run one thread each, chosen by the scheduler and rotated every quantum or when
# the thread stalls; every other thread is confined to the small cores.
# test/demo-scheduling builds the same machine with `-c big,big,small,small`,
# which tags each core after its config's name; here the tags and the per-core
# widths are spelled out so the fragment layers on a plain machine config.
#
# Four cores: two big (gainestown's 4-wide, 128-entry window) and two small
# (1-wide, 16-entry).  The arrays are per core; with fewer cores the extra
# entries are simply unused.
#
# Usage:
#   run-sniper -n 4 -cgainestown -cscheduler_configs/big_small

[scheduler]
type = big_small

[scheduler/big_small]
quantum = 10000         # ns; test/demo-scheduling's value
debug = true            # print the [SchedulerBigSmall] decisions

[tags]
core/big = 1,1,0,0

[perf_model/core/interval_timer]
dispatch_width = 4,4,1,1
window_size = 128,128,16,16
