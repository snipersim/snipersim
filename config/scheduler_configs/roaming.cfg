# Roaming scheduler
# =================
# Selects scheduler/type = roaming (SchedulerRoaming): threads are not bound to
# a core; a thread that becomes runnable takes the first free core in the mask
# rather than waiting for the one it last ran on.  base.cfg carries the keys
# under [scheduler/roaming] but every shipped config schedules pinned.
# Needs a multi-threaded workload to mean anything.
#
# Usage:
#   run-sniper -n 4 -cgainestown -cscheduler_configs/roaming

[scheduler]
type = roaming

[scheduler/roaming]
quantum = 1000000       # ns; round-robin for active threads on each core
core_mask = 1           # every core
