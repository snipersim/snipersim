# Sequential scheduler
# ====================
# Selects scheduler/type = sequential (SchedulerSequential): threads are
# assigned to cores in creation order following `sequence`, a '|'-separated
# count of threads per core, and the threads of one core run one after the
# other -- the next starts when the previous exits.  Written for pinball sets
# (each pinball of a split process in turn on its core); for a threaded
# program every thread the others wait on must be in a slot of its own.  At
# simulation end it prints a [REPORT] per thread (cycles, instructions,
# per-level misses, from the per-thread statistics it registers against the
# caches' load-misses and store-misses totals), or writes it to sequence_file
# if set.  base.cfg has no [scheduler/sequential] section: the keys live here.
#
# This sequence is for four cores and a program of five threads: the main
# thread and three workers on cores 0-2, the last two workers one after the
# other on core 3 (testing/apps/threaded.c, whose main thread only joins).
# With fewer than four cores the scheduler refuses to start, since every
# slot of the sequence needs a core of its own.  With one program the threads
# keep their shared address space; the per-core address spaces the scheduler
# gives pinball sets apply only when there are several applications.
#
# Usage:
#   run-sniper -n 4 -cgainestown -cscheduler_configs/sequential

[scheduler]
type = sequential

[scheduler/sequential]
sequence = "1|1|1|2"    # threads per core, in thread creation order
sequence_file = ""      # empty: print the report to stdout
verbose = true          # [SCHED] line per scheduling decision
